<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern School Management &amp; Information System - Login</title>
  <script src="js/tailwind-cdn.js"></script>
  <link rel="stylesheet" href="css/fontawesome.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800">

<div class="school-photo-background min-h-screen flex items-center justify-center p-4">
  <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl w-full max-w-md overflow-hidden fade-in">

    <!-- Header -->
    <div class="bg-gradient-to-r from-sky-600 to-indigo-600 p-4 sm:p-6 text-white text-center">
      <div class="flex flex-col items-center gap-3">
        <img src="logo/logo.jpg" alt="School system logo" class="w-24 h-24 rounded-2xl object-cover shadow-md">
        <h1 class="whitespace-nowrap text-[10px] font-bold leading-snug sm:text-xs md:text-sm lg:text-base">Modern School Management &amp; Information System</h1>
      </div>
    </div>

    <div class="p-8">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-xl font-semibold text-slate-700">Sign In</h2>
          <p class="text-sm text-slate-500">Enter your account credentials to continue.</p>
        </div>
        <a href="index.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-slate-600 text-sm font-medium">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true">
            <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Back</span>
        </a>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <!-- Username -->
        <div>
          <label for="loginUsername" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input id="loginUsername" type="text" name="loginUsername" required
            placeholder="Enter your username"
            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
        </div>

        <!-- Password -->
        <div>
          <label for="loginPassword" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <div class="relative">
            <input id="loginPassword" type="password" name="loginPassword" required
              placeholder="Enter your password"
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 pr-10">
            <button type="button" onclick="togglePwd()" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit"
          class="inline-flex items-center justify-center gap-2 w-full px-4 py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-semibold transition-colors">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true">
            <path d="M10 7.5 8.5 9l2 2m-2-2h7m-6 6 1.5 1.5M5 5v14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Login</span>
        </button>
      </form>

      <div class="mt-4 text-right">
        <button type="button" onclick="openPasswordRecoveryModal()" class="text-sm font-medium text-sky-600 hover:text-sky-700 underline">Forgot password?</button>
      </div>

      <!-- Register link -->
      <div class="mt-5 pt-5 border-t border-slate-100 text-center">
        <p class="text-sm text-slate-500 mb-2">Is your school not registered yet?</p>
        <a href="register.html"
          class="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold text-sm transition-colors">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true">
            <path d="M5 5.5A1.5 1.5 0 0 1 6.5 4h11A1.5 1.5 0 0 1 19 5.5v3A1.5 1.5 0 0 1 17.5 10h-11A1.5 1.5 0 0 1 5 8.5v-3Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7 14h10M7 18h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span>Register Your School</span>
        </a>
      </div>

    </div>
  </div>
</div>

<div id="modalContainer"></div>
<div id="toastContainer"></div>

<script src="js/app.js"></script>
<script>
  function togglePwd() {
    const f = document.getElementById('loginPassword');
    const i = document.getElementById('eyeIcon');
    if (f.type === 'password') {
      f.type = 'text';
      i.setAttribute('viewBox', '0 0 24 24');
      i.innerHTML = '<path d="M3 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S3 12 3 12Z" stroke="currentColor" stroke-width="1.6"/><path d="M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0Z" stroke="currentColor" stroke-width="1.6"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
    } else {
      f.type = 'password';
      i.innerHTML = '<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>';
    }
  }
</script>
</body>
</html>
