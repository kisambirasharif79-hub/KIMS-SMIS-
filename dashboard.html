<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - KIMS IT SOLUTIONS</title>
  <script src="js/tailwind-cdn.js"></script>
  <script src="js/chart.min.js"></script>
  <script src="js/qrcode.min.js"></script>
  <link rel="stylesheet" href="css/fontawesome.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800">

  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col no-print">
      <div class="p-5 border-b border-slate-200">
        <div class="flex items-center gap-3">
          <img id="sidebarLogo" src="" alt="School Logo" class="w-10 h-10 rounded-lg object-cover shadow-sm hidden">
          <span id="sidebarDefaultIcon">
            <img src="logo/logo.jpg" alt="KIMS IT SOLUTIONS" class="w-10 h-10 rounded-lg object-cover shadow-sm">
          </span>
          <div>
            <h1 class="font-bold text-slate-800">KIMS IT SOLUTIONS</h1>
            <p id="roleLabel" class="text-xs text-slate-500">Loading…</p>
          </div>
        </div>
      </div>
      <nav id="navMenu" class="flex-1 p-4 space-y-1 overflow-y-auto"></nav>
      <div class="p-4 border-t border-slate-200">
        <button type="button" onclick="logout()"
          class="w-full flex items-center gap-3 px-4 py-2.5 text-red-600 hover:bg-red-50 rounded-lg transition-colors">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true">
            <path d="M10 7.5 8.5 9l2 2m-2-2h7m-6 6 1.5 1.5M5 5v14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="logoutButtonText" class="font-medium">Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-white border-b border-slate-200 px-6 py-4 no-print">
        <div class="flex items-center justify-between">
          <div>
            <h2 id="pageTitle" class="text-2xl font-bold text-slate-800">Dashboard</h2>
            <p id="pageSubtitle" class="text-sm text-slate-500">Welcome back to KIMS IT SOLUTIONS</p>
          </div>
          <div class="flex items-center gap-4">
            <label for="themePreference" class="sr-only">Choose your theme</label>
            <select id="themePreference" data-theme-preference aria-label="Choose your theme" class="max-w-28 sm:max-w-none px-1 sm:px-2 py-1.5 border border-slate-300 rounded-lg text-xs sm:text-sm">
              <option value="light">Light theme</option>
              <option value="dark">Dark theme</option>
              <option value="system">System theme</option>
            </select>
            <div class="text-right hidden sm:block">
              <p class="text-sm font-semibold" id="userName"></p>
              <p class="text-xs text-slate-500">A/Y 2026</p>
            </div>
            <div id="notifWrap" class="relative">
              <button id="notifBtn" title="Notifications" class="relative inline-flex items-center justify-center w-10 h-10 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">
                <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5" aria-hidden="true">
                  <path d="M8 17h8M9 17V10a3 3 0 0 1 6 0v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M10 18a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span id="notifCount" class="absolute -top-1 -right-1 bg-red-600 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center hidden">0</span>
              </button>
            </div>
            <div class="w-10 h-10 bg-gradient-to-br from-sky-400 to-indigo-500 rounded-full flex items-center justify-center text-white font-bold text-lg">
              <span id="userInitial">?</span>
            </div>
          </div>
        </div>
      </header>
      <div id="contentArea" class="flex-1 overflow-y-auto p-6 bg-slate-50"></div>
    </main>
  </div>

  <div id="modalContainer"></div>
  <div id="toastContainer"></div>

  <script src="js/app.js?v=20261104-1053"></script>
  <script>
    // ── Per-school data shim ──────────────────────────────────────────────────
    // Makes all existing functions that read DB.staff / DB.students / DB.marks
    // transparently work against the active school stored in localStorage.

    function syncSchoolToDB() {
      const school = getActiveSchool();
      if (!school) return;
      if (Array.isArray(school.classes)) DB.classes = school.classes;
      DB.staff    = school.staff    || [];
      DB.students = school.students || [];
      DB.marks    = school.marks    || {};
      const defaultGradeScale = getOwnerConfiguration().gradeScale;
      DB.gradeScale = Array.isArray(school.gradeScale) && school.gradeScale.length
        ? school.gradeScale.map(grade => ({ ...grade }))
        : defaultGradeScale.map(grade => ({ ...grade }));
    }

    function saveAppData() {
      const school = getActiveSchool();
      if (!school) return;
      school.staff    = DB.staff;
      school.students = DB.students;
      school.marks    = DB.marks;
      saveSchool(school);
      try { generateReports(); } catch(e) { /* ignore if generation blocked by payment or other checks */ }
    }

    const MARK_WORKFLOW_STEPS = [
      'subject-entered',
      'class-compiled'
    ];
    let generatedReportContext = null;
    let selectedAuditLogIds = new Set();
    let auditPrintLogIds = null;

    const MARK_WORKFLOW_STEP_INDEX = Object.fromEntries(MARK_WORKFLOW_STEPS.map((step, index) => [step, index]));

    function getMarkWorkflowKey(cls, term) {
      return `${String(cls || '').trim()}::${String(term || '1').trim()}`;
    }

    function getSubjectSubmissionKey(cls, term, subject) {
      return `${getMarkWorkflowKey(cls, term)}::${String(subject || '').trim()}`;
    }

    function getSubjectMarkSubmission(cls, term, subject) {
      const school = getActiveSchool();
      if (!school) return null;
      return (school.subjectMarkSubmissions || {})[getSubjectSubmissionKey(cls, term, subject)] || null;
    }

    function getAverageMark(mark) {
      const enteredMarks = ['bot', 'mot', 'eot']
        .map(type => mark?.[type])
        .filter(value => value !== '' && value !== null && value !== undefined)
        .map(Number);
      return enteredMarks.length
        ? Math.round(enteredMarks.reduce((sum, value) => sum + value, 0) / enteredMarks.length)
        : '';
    }

    function studentHasReportMarks(studentId, term, subjects, reportType) {
      const markTypes = reportType === 'BOT' ? ['bot']
        : reportType === 'MOT' ? ['mot']
        : reportType === 'EOT' ? ['eot']
        : ['bot', 'mot', 'eot'];
      const marks = getTermMarks(studentId, term);
      return subjects.some(subject => markTypes.some(type => {
        const value = marks[subject]?.[type];
        return value !== '' && value !== null && value !== undefined;
      }));
    }

    function hasAnySubjectMarks(cls, term, subject) {
      const students = DB.students.filter(student => student.class === cls);
      return students.some(student => {
        const mark = getTermMarks(student.id, term)[subject];
        return getAverageMark(mark) !== '';
      });
    }

    function submitSubjectMarks() {
      if (getCurrentSchoolRole() !== 'subject_teacher') {
        showToast('Only the Subject Teacher can upload subject marks.', 'error');
        return;
      }
      const cls = document.getElementById('subjectTeacherClass')?.value || '';
      const subject = document.getElementById('subjectTeacherSubject')?.value || '';
      const term = document.getElementById('subjectTeacherTerm')?.value || '1';
      if (!cls || !subject) return;
      if (!hasAnySubjectMarks(cls, term, subject)) {
        showToast('Enter at least one student mark before uploading this subject.', 'error');
        return;
      }
      if (getMarkWorkflow(cls, term).status !== 'subject-entered') {
        showToast('This class list has already been compiled.', 'error');
        return;
      }
      const school = getActiveSchool();
      school.subjectMarkSubmissions = school.subjectMarkSubmissions || {};
      school.subjectMarkSubmissions[getSubjectSubmissionKey(cls, term, subject)] = {
        status: 'submitted',
        submittedAt: new Date().toISOString(),
        submittedBy: getCurrentUserDisplay()
      };
      saveSchool(school);
      showToast(`${subject} marks for ${cls} uploaded to the Class Teacher.`, 'success');
      loadSubjectTeacherMarks();
    }

    function getMarkWorkflow(cls, term) {
      const school = getActiveSchool();
      if (!school) return null;
      const key = getMarkWorkflowKey(cls, term);
      const workflow = (school.markWorkflow || {})[key];
      if (workflow && ['class-approved', 'dos-approved', 'head-teacher-recommended', 'school-admin-report-ready'].includes(workflow.status)) {
        workflow.status = 'class-compiled';
        school.markWorkflow[key] = workflow;
        saveSchool(school);
      }
      return workflow || {
        status: 'subject-entered',
        updatedAt: null,
        history: []
      };
    }

    function setMarkWorkflowStatus(cls, term, status, actorRole, actorName) {
      const school = getActiveSchool();
      if (!school) return false;
      if (!MARK_WORKFLOW_STEP_INDEX[status]) return false;
      const key = getMarkWorkflowKey(cls, term);
      const current = getMarkWorkflow(cls, term);
      const currentIndex = MARK_WORKFLOW_STEP_INDEX[current.status] ?? -1;
      const nextIndex = MARK_WORKFLOW_STEP_INDEX[status];
      if (nextIndex <= currentIndex || (currentIndex >= 0 && nextIndex !== currentIndex + 1)) {
        showToast(`The mark list is not ready for this workflow step.`, 'error');
        return false;
      }
      school.markWorkflow = school.markWorkflow || {};
      const history = Array.isArray(current.history) ? [...current.history] : [];
      history.push({ status: current.status, actorRole, actorName, at: new Date().toISOString() });
      school.markWorkflow[key] = {
        status,
        updatedAt: new Date().toISOString(),
        actorRole,
        actorName,
        history
      };
      saveSchool(school);
      return true;
    }

    function canMoveMarkWorkflow(cls, term, role, targetStatus) {
      const current = getMarkWorkflow(cls, term);
      const targetIndex = MARK_WORKFLOW_STEP_INDEX[targetStatus];
      const currentIndex = MARK_WORKFLOW_STEP_INDEX[current.status];
      if (targetIndex === undefined || currentIndex === undefined) return false;
      if (targetStatus === 'class-compiled' &&
          (!canAccessAction(role, 'compile_marks') || !canAccessAction(role, 'upload_to_admin'))) return false;
      return currentIndex + 1 === targetIndex;
    }

    function getCurrentMarkWorkflowLabel(cls, term) {
      const status = getMarkWorkflow(cls, term).status;
      const labels = {
        'subject-entered': 'Subject marks entered',
        'class-compiled': 'Class list compiled and uploaded'
      };
      return labels[status] || 'Not started';
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      const serverAuth = await restoreServerSession();
      if (!serverAuth) {
        clearAuthState();
        window.location.href = 'login.html';
        return;
      }
      if (!requireAuthentication()) return;
      initSystemAnnouncementSlideshows();
      initializeThemePreferenceControls();
      startSessionTimeoutMonitor();

      const auth = getAuthentication();
      if (auth?.role === 'admin') {
        document.getElementById('roleLabel').textContent   = 'System Owner';
        document.getElementById('userName').textContent    = 'System Owner';
        document.getElementById('userInitial').textContent = 'A';
        setupAdminNav();
        initAdminNotifications();
      } else {
        const school = getActiveSchool();
        if (!school) { logout(); return; }

        // Sidebar logo
        const logoSlot = document.getElementById('sidebarLogo');
        const defIcon  = document.getElementById('sidebarDefaultIcon');
        if (school.logoDataUrl && logoSlot) {
          logoSlot.src = school.logoDataUrl;
          logoSlot.classList.remove('hidden');
          if (defIcon) defIcon.style.display = 'none';
        }
        document.getElementById('roleLabel').textContent   = auth?.role === 'school_parent' ? 'School Account Hub' : school.district || 'School';
        document.getElementById('userName').textContent    = school.name;
        document.getElementById('userInitial').textContent = school.name.charAt(0).toUpperCase();
        document.getElementById('logoutButtonText').textContent = auth?.role === 'school_parent'
          ? 'Logout School Account'
          : 'Logout Department';

        if (auth?.role === 'school_parent') {
          setupSchoolParentNav();
        } else {
          syncSchoolToDB();
          setupSchoolNav();
        }
      }

      // Force initial render (currentView starts as 'dashboard' in DB, reset it)
      DB.currentView = null;
      navigate('dashboard');
      if (auth?.role === 'school_parent') {
        try {
          const setupStatus = await getSchoolAdminSetupStatus();
          if (setupStatus.required) showSchoolAdminFirstLoginSetup();
        } catch (error) {
          console.error('Could not check first-time School Administrator setup:', error);
          showToast(`Could not check School Administrator setup: ${error.message}`, 'error');
        }
      }
      if (auth?.role !== 'admin') initUserAnnouncementNotifications();
      else scheduleSystemAnnouncementRefresh();
    });

    // ── Navigation ────────────────────────────────────────────────────────────
    function setupAdminNav() {
      renderNav([
        { id: 'dashboard',      icon: 'dashboard',      label: 'Dashboard' },
        { id: 'schools',        icon: 'school',         label: 'Schools Management' },
        { id: 'subscriptions',  icon: 'subscription',   label: 'Subscriptions' },
        { id: 'academic-years', icon: 'calendar',       label: 'Academic Years' },
        { id: 'users',          icon: 'users',          label: 'Users & Roles' },
        { id: 'admins',         icon: 'admin',          label: 'School Administrators' },
        { id: 'payments',       icon: 'wallet',         label: 'Payment Management' },
        { id: 'templates',      icon: 'template',       label: 'Report Card Templates' },
        { id: 'grading',        icon: 'grading',        label: 'Grading Systems' },
        { id: 'sms',            icon: 'sms',            label: 'SMS & Email' },
        { id: 'system-reports', icon: 'reports',        label: 'System Reports' },
        { id: 'audit',          icon: 'audit',          label: 'Audit Logs' },
        { id: 'support',        icon: 'support',        label: 'Support Tickets' },
        { id: 'announcements',  icon: 'announcement',   label: 'Announcements' },
        { id: 'backups',        icon: 'backup',         label: 'Backups' },
        { id: 'settings',       icon: 'settings',       label: 'System Settings' },
        { id: 'profile',        icon: 'profile',        label: 'Profile' },
      ]);
    }

    function setupSchoolParentNav() {
      renderNav([
        { id: 'account-hub', icon: 'users', label: 'Department Accounts' },
        { id: 'dashboard', icon: 'dashboard', label: 'School Overview' },
        { id: 'support', icon: 'support', label: 'Support Tickets' }
      ]);
    }

    function setupSchoolNav() {
      const auth = getAuthentication();
      const role = auth?.userRole || 'school_admin';
      renderNav(getSchoolRoleNavigation(role));
    }

    function renderNav(items) {
      const iconMarkup = (name) => {
        const icons = {
          dashboard: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5v8A1.5 1.5 0 0 1 18.5 20h-11A1.5 1.5 0 0 1 6 18.5v-8Z" stroke="currentColor" stroke-width="1.8"/><path d="M9 20v-5h6v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
          school: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4h11A1.5 1.5 0 0 1 19 5.5v3A1.5 1.5 0 0 1 17.5 10h-11A1.5 1.5 0 0 1 5 8.5v-3Z" stroke="currentColor" stroke-width="1.6"/><path d="M7 14h10M7 18h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          book: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M6 5.5A2.5 2.5 0 0 1 8.5 3H17v15H8.5A2.5 2.5 0 0 0 6 20.5V5.5Z" stroke="currentColor" stroke-width="1.8"/><path d="M9 7h5M9 11h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          calendar: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          users: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M15 18a4 4 0 0 0-6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16 8h4m-2-2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          admin: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M12 4 6 7v5c0 3.4 2.2 6.4 6 8 3.8-1.6 6-4.6 6-8V7l-6-3Z" stroke="currentColor" stroke-width="1.8"/><path d="M10 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          wallet: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15 13h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          template: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
          grading: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M6 19V9m6 10V5m6 14v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
          subscription: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          sms: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M6 9l6 4 6-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
          audit: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/><path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          support: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M7 8h10M7 12h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 5h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H12l-4 3v-3H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8"/></svg>`,
          announcement: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M6 6h12M6 10h8M6 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 18h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          backup: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M7 6h10l2 3v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9l2-3Z" stroke="currentColor" stroke-width="1.8"/><path d="M9 13h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          settings: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7.1 7.1 0 0 0-2.1-1.2l-.2-2.6h-4l-.2 2.6a7.1 7.1 0 0 0-2.1 1.2l-2.4-1-2 3.5 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.5 2.4-1c.6.5 1.3.9 2.1 1.2l.2 2.6h4l.2-2.6a7.1 7.1 0 0 0 2.1-1.2l2.4 1 2-3.5-2-1.5c.1-.4.1-.8.1-1.2Z" stroke="currentColor" stroke-width="1.2"/></svg>`,
          profile: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M5 19a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
          class: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 9h8M8 13h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          students: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><circle cx="8" cy="9" r="3" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="8" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M4 18a4 4 0 0 1 8 0m4-5a3 3 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          marks: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M6 4h8l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/><path d="M14 4v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
          reports: `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 13h6M9 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`
        };
        return icons[name] || `<svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M7 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
      };
      document.getElementById('navMenu').innerHTML = items.map(item => `
        <button type="button" onclick="navigate('${item.id}')" id="nav-${item.id}"
          class="nav-button w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-700">

    function navigate(view) {
      const auth = getAuthentication();
      const role = auth?.userRole || 'school_admin';
      const viewPermissions = {
        'subject-marks': ['edit_marks'],
        marks: ['enter_marks'],
        'class-compile': ['compile_marks', 'upload_to_admin'],
        'submitted-mark-lists': ['view_marks'],
        grading: ['manage_grading_scale'],
        'reports': ['print_report_cards', 'generate_reports'],
        students: ['register_students', 'enroll_students'],
        staff: ['manage_staff'],
        classes: ['manage_classes'],
        'manage-settings': ['manage_department_logins'],
        'department-logins': ['manage_department_logins'],
        'account-hub': ['school_admin']
      };
      const requiredActions = viewPermissions[view] || [];
      const hasPermission = view === 'class-compile'
        ? requiredActions.every(action => canAccessAction(role, action))
        : requiredActions.some(action => canAccessAction(role, action));
      if (auth?.role === 'school_parent') {
        if (!['account-hub', 'dashboard', 'support'].includes(view)) {
          showToast('Use the school account hub to select a department.', 'error');
          return;

      } else if (view === 'audit' && auth?.role !== 'admin') {
        showToast('Audit logs are only available to the System Owner.', 'error');
        return;
      } else if (viewPermissions[view] && !hasPermission) {
        showToast('This action is not available in your department account.', 'error');
        return;
      }
      const contentArea = document.getElementById('contentArea');
      if (DB.currentView === view && contentArea.innerHTML.trim() !== '') return;
      DB.currentView = view;

      document.querySelectorAll('#navMenu button').forEach(b => b.classList.remove('nav-active'));
      const btn = document.getElementById('nav-' + view);

        dashboard:      renderDashboard,

        schools:        renderSchools,

        settings:       renderSystemSettings,
        profile:        renderProfile,

        staff:           renderStaff,
        classes:         renderClasses,
        students:        renderStudents,
        marks:           renderMarks,

        'subject-summary': renderSubjectTeacherSummary,
        'class-compile': renderClassTeacherCompilation,
        'submitted-mark-lists': renderAdminSubmittedMarkLists,
        reports:         renderReports
      };
      if (views[view]) {
        contentArea.style.opacity = '0.4';
        setTimeout(() => { views[view](); contentArea.style.opacity = '1'; }, 40);

    let systemAnnouncementTimer = null;
    let systemAnnouncementSlideshowTimer = null;

    function setSystemAnnouncementSlide(carousel, index) {
      const slides = [...carousel.querySelectorAll('[data-announcement-slide]')];
      if (!slides.length) return;
      const activeIndex = (index + slides.length) % slides.length;
      const track = carousel.querySelector('[data-announcement-slide-track]');
      slides.forEach((slide, slideIndex) => {
        slide.classList.toggle('announcement-slide-active', slideIndex === activeIndex);
        slide.setAttribute('aria-hidden', String(slideIndex !== activeIndex));
        slide.inert = slideIndex !== activeIndex;
      });
      if (track) track.style.transform = `translateX(-${activeIndex * (100 / slides.length)}%)`;
      const counter = carousel.querySelector('[data-announcement-slide-count]');
      if (counter) counter.textContent = `${activeIndex + 1} / ${slides.length}`;
      carousel.dataset.slideIndex = String(activeIndex);
    }

    function initSystemAnnouncementSlideshows() {
      if (systemAnnouncementSlideshowTimer) return;
      const initializeCarousels = root => {
        root.querySelectorAll('[data-announcement-carousel]').forEach(carousel => {
          if (!carousel.dataset.nextSlideAt) {
            carousel.dataset.nextSlideAt = String(Date.now() + 5000);
          }
        });
      };
      initializeCarousels(document);
      new MutationObserver(records => records.forEach(record =>
        record.addedNodes.forEach(node => {
          if (node.nodeType === Node.ELEMENT_NODE) initializeCarousels(node);
        })
      )).observe(document.body, { childList: true, subtree: true });
      document.addEventListener('click', event => {
        const button = event.target instanceof Element && event.target.closest('[data-announcement-slide-step]');
        if (!button) return;
        const carousel = button.closest('[data-announcement-carousel]');
        if (!carousel) return;
        const currentIndex = Number(carousel.dataset.slideIndex || 0);
        const step = Number(button.dataset.announcementSlideStep);
        setSystemAnnouncementSlide(carousel, currentIndex + step);
        carousel.dataset.nextSlideAt = String(Date.now() + 5000);
      });
      systemAnnouncementSlideshowTimer = setInterval(() => {
        const now = Date.now();
        document.querySelectorAll('[data-announcement-carousel]').forEach(carousel => {
          const slides = carousel.querySelectorAll('[data-announcement-slide]');
          if (slides.length < 2) return;
          let nextSlideAt = Number(carousel.dataset.nextSlideAt);
          if (!Number.isFinite(nextSlideAt)) {
            nextSlideAt = now + 5000;
            carousel.dataset.nextSlideAt = String(nextSlideAt);
          }
          if (now < nextSlideAt) return;
          const steps = Math.floor((now - nextSlideAt) / 5000) + 1;
          setSystemAnnouncementSlide(carousel, Number(carousel.dataset.slideIndex || 0) + steps);
          carousel.dataset.nextSlideAt = String(nextSlideAt + steps * 5000);
        });
      }, 250);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          document.querySelectorAll('[data-announcement-carousel]').forEach(carousel => {
            const slides = carousel.querySelectorAll('[data-announcement-slide]');
            const nextSlideAt = Number(carousel.dataset.nextSlideAt);
            if (slides.length < 2 || !Number.isFinite(nextSlideAt) || Date.now() < nextSlideAt) return;
            const steps = Math.floor((Date.now() - nextSlideAt) / 5000) + 1;
            setSystemAnnouncementSlide(carousel, Number(carousel.dataset.slideIndex || 0) + steps);
            carousel.dataset.nextSlideAt = String(nextSlideAt + steps * 5000);
          });
        }
      });
    }

    function scheduleSystemAnnouncementRefresh() {
      clearTimeout(systemAnnouncementTimer);
      const now = Date.now();
      const upcomingTimes = getSystemAnnouncements().flatMap(announcement =>
        [announcement.startsAt, announcement.expiresAt]
          .map(value => value ? new Date(value).getTime() : NaN)
          .filter(time => Number.isFinite(time) && time > now)
      );
      if (!upcomingTimes.length) return;
      const nextChange = Math.min(...upcomingTimes);
      systemAnnouncementTimer = setTimeout(() => {
        updateAnnouncementNotificationBadge();
        if (DB.currentView === 'dashboard') renderDashboard();
        if (document.getElementById('systemAnnouncementNotifications')) openUserAnnouncementNotifications();
        const justStarted = getSystemAnnouncements().some(announcement => {
          const startsAt = new Date(announcement.startsAt).getTime();
          return Number.isFinite(startsAt) && startsAt <= Date.now() && startsAt > Date.now() - 2000;
        });
        if (justStarted && getUnreadSystemAnnouncements().length) openUserAnnouncementNotifications(true);
        scheduleSystemAnnouncementRefresh();
      }, Math.min(Math.max(0, nextChange - now + 50), 2147483647));
    }

      const images = getSystemAnnouncementImages(announcement);
      if (!images.length) return '';
      const title = escapeHtml(announcement.title);
      const carouselId = `announcement-carousel-${escapeHtml(announcement.id)}`;
      return `<div id="${carouselId}" data-announcement-carousel data-slide-index="0" class="mt-3 max-w-3xl">
        <div class="relative overflow-hidden rounded-lg border border-sky-100 bg-white">

            ${images.map((imageDataUrl, index) => {
            const image = escapeHtml(imageDataUrl);
            return `<a href="${image}" target="_blank" rel="noopener noreferrer" aria-label="Open full-size flyer ${index + 1} of ${images.length} for ${title}" data-announcement-slide class="block shrink-0" style="width:${100 / images.length}%" aria-hidden="${index !== 0}" ${index ? 'inert' : ''}>
              <img src="${image}" alt="${title} flyer ${index + 1} of ${images.length} - select to open full size" class="max-h-[32rem] w-full object-contain">
            </a>`;
            }).join('')}
          </div>
          ${images.length > 1 ? `<div class="absolute inset-x-0 bottom-0 flex items-center justify-between bg-slate-950/70 px-3 py-2 text-white">
            <button type="button" data-announcement-slide-step="-1" aria-controls="${carouselId}" aria-label="Previous flyer" class="rounded-full bg-white/15 px-3 py-1 hover:bg-white/30">&larr;</button>
            <span data-announcement-slide-count aria-live="polite" class="text-sm">1 / ${images.length}</span>
            <button type="button" data-announcement-slide-step="1" aria-controls="${carouselId}" aria-label="Next flyer" class="rounded-full bg-white/15 px-3 py-1 hover:bg-white/30">&rarr;</button>
          </div>` : ''}
        </div>
      </div>`;
    }

    function renderSystemAnnouncementFeed() {

      const deletedIds = getDeletedSystemAnnouncementIds();
      const announcements = getSystemAnnouncements().filter(announcement =>
        isSystemAnnouncementActive(announcement) &&
        !dismissedIds.has(String(announcement.id)) && !deletedIds.has(String(announcement.id))
      );
      if (!announcements.length) return '';
      return `
        <section id="systemAnnouncementFeed" class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">

              const announcementId = escapeHtml(announcement.id);
              const expiry = new Date(announcement.expiresAt);
              return `<article id="system-announcement-${announcementId}" data-system-announcement-card class="border-l-4 border-sky-500 bg-sky-50/70 rounded-r-lg p-4">
                <div class="flex flex-wrap items-start justify-between gap-2">
                  <h4 class="font-semibold text-slate-800">${escapeHtml(announcement.title)}</h4>
                  <div class="flex items-center gap-3">
                    <time class="text-xs text-slate-500">${escapeHtml(publishedAt)}</time>
                    <button type="button" onclick="dismissAnnouncementFromFeed('${announcementId}')" class="text-xs font-medium text-slate-500 hover:text-slate-800 underline">Dismiss</button>
                  </div>
                </div>
                ${announcement.message ? `<p class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(announcement.message)}</p>` : ''}
                ${renderSystemAnnouncementImage(announcement)}
                ${!announcement.message && getSystemAnnouncementImages(announcement).length ? '<p class="text-sm text-slate-700 mt-2">See the attached flyer for details.</p>' : ''}
                ${!Number.isNaN(expiry.getTime()) ? `<p class="text-xs text-slate-500 mt-3">Displayed until ${escapeHtml(expiry.toLocaleString())}</p>` : ''}
              </article>`;

    function getUnreadSystemAnnouncements() {
      if (!getSystemSettings().notifications.announcementAlerts) return [];
      const dismissedIds = getDismissedSystemAnnouncementIds();
      const deletedIds = getDeletedSystemAnnouncementIds();
      return getSystemAnnouncements().filter(announcement =>
        isSystemAnnouncementActive(announcement) &&
        !dismissedIds.has(String(announcement.id)) && !deletedIds.has(String(announcement.id))
      );
    }

    function updateAnnouncementNotificationBadge() {
      const badge = document.getElementById('notifCount');
      if (!badge) return;
      const count = getUnreadSystemAnnouncements().length;
      badge.textContent = count;
      badge.classList.toggle('hidden', count === 0);
      document.getElementById('notifBtn')?.setAttribute('aria-label', `Notifications${count ? `, ${count} new announcements` : ''}`);
    }

    function initUserAnnouncementNotifications() {
      if (getAuthentication()?.role === 'admin') return;
      const button = document.getElementById('notifBtn');
      if (button) button.addEventListener('click', () => {
        if (getSystemSettings().notifications.announcementAlerts) openUserAnnouncementNotifications();
        else showToast('Announcement notifications are disabled by the System Owner.', 'info');
      });
      updateAnnouncementNotificationBadge();

      if (getUnreadSystemAnnouncements().length) {
        setTimeout(() => openUserAnnouncementNotifications(true), 250);
      }

      window.addEventListener('storage', event => {
        if (![SYSTEM_ANNOUNCEMENTS_KEY, SYSTEM_ANNOUNCEMENT_DISMISSALS_KEY, SYSTEM_ANNOUNCEMENT_DELETIONS_KEY].includes(event.key)) return;
        scheduleSystemAnnouncementRefresh();
        updateAnnouncementNotificationBadge();
        if (event.key === SYSTEM_ANNOUNCEMENTS_KEY && DB.currentView === 'dashboard') renderDashboard();
        if (document.getElementById('systemAnnouncementNotifications')) openUserAnnouncementNotifications();
        if (event.key === SYSTEM_ANNOUNCEMENTS_KEY && getUnreadSystemAnnouncements().length) openUserAnnouncementNotifications(true);
      });
      scheduleSystemAnnouncementRefresh();
    }

    function openUserAnnouncementNotifications(isPopup = false) {
      if (getAuthentication()?.role === 'admin') return;
      const dismissedIds = getDismissedSystemAnnouncementIds();
      const deletedIds = getDeletedSystemAnnouncementIds();
      const announcements = getSystemAnnouncements().filter(announcement => {
        const id = String(announcement.id);
        return isSystemAnnouncementActive(announcement) &&
          !deletedIds.has(id) && (!isPopup || !dismissedIds.has(id));
      });
      const list = announcements.map(announcement => {
        const date = new Date(announcement.createdAt);
        const publishedAt = Number.isNaN(date.getTime()) ? 'Recently published' : date.toLocaleString();
        const announcementId = escapeHtml(announcement.id);
        const isRead = dismissedIds.has(String(announcement.id));
        const expiry = new Date(announcement.expiresAt);
        return `<article class="border-l-4 border-sky-500 bg-sky-50/70 rounded-r-lg p-4">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div>
              <h4 class="font-semibold text-slate-800">${escapeHtml(announcement.title)}</h4>
              <div class="flex items-center gap-2 mt-1"><time class="text-xs text-slate-500">${escapeHtml(publishedAt)}</time><span class="text-xs px-2 py-0.5 rounded-full ${isRead ? 'bg-slate-100 text-slate-600' : 'bg-sky-100 text-sky-700'}">${isRead ? 'Read' : 'Unread'}</span></div>
            </div>
            <div class="flex items-center gap-3">
              ${isRead ? '' : `<button type="button" onclick="dismissAnnouncementFromNotifications('${announcementId}')" class="text-xs font-medium text-slate-600 hover:text-slate-900 underline">Dismiss</button>`}
              <button type="button" onclick="deleteAnnouncementFromNotifications('${announcementId}')" class="text-xs font-medium text-red-700 hover:text-red-900 underline">Delete</button>
            </div>
          </div>
          ${announcement.message ? `<p class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(announcement.message)}</p>` : ''}
          ${renderSystemAnnouncementImage(announcement)}
          ${!announcement.message && getSystemAnnouncementImages(announcement).length ? '<p class="text-sm text-slate-700 mt-2">See the attached flyer for details.</p>' : ''}
          ${!Number.isNaN(expiry.getTime()) ? `<p class="text-xs text-slate-500 mt-3">Displayed until ${escapeHtml(expiry.toLocaleString())}</p>` : ''}
        </article>`;
      }).join('');
      const title = isPopup ? 'New School Announcements' : 'Notification History';
      const emptyState = isPopup ? 'There are no new announcements.' : 'There are no announcements in your history.';
      showModal(`
        <div id="systemAnnouncementNotifications" class="p-6 max-w-xl">
          <div class="flex items-start justify-between gap-4 mb-4">
            <div>
              <h3 class="text-xl font-bold">${title}</h3>
              <p class="text-sm text-slate-500 mt-1">${announcements.length} ${isPopup ? 'new' : 'total'} ${announcements.length === 1 ? 'announcement' : 'announcements'}</p>
            </div>
            <button type="button" onclick="closeModal()" aria-label="Close notifications" class="w-8 h-8 text-xl leading-none text-slate-500 hover:text-slate-800">&times;</button>
          </div>
          <div class="space-y-3 max-h-[65vh] overflow-y-auto">${list || `<p class="text-sm text-slate-500 py-5">${emptyState}</p>`}</div>
          <div class="flex justify-end mt-5">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold">Close</button>
          </div>
        </div>`);
    }

    function dismissAnnouncementFromNotifications(announcementId) {
      if (!dismissSystemAnnouncementForViewer(announcementId)) return;
      updateAnnouncementNotificationBadge();
      openUserAnnouncementNotifications();
    }

    function dismissAnnouncementFromFeed(announcementId) {
      if (!dismissSystemAnnouncementForViewer(announcementId)) return;
      updateAnnouncementNotificationBadge();
    }

    function deleteAnnouncementFromNotifications(announcementId) {

    function renderSchoolDashboard() {
      const school = getActiveSchool();
      if (!school) return;
      const teachers = DB.staff.filter(staff => /teacher/i.test(staff.role || '')).length;
      const classes = DB.classes.filter(cls => DB.students.some(student => student.class === cls));
      const activeStudents = DB.students.length;
      const levelSubjects = { lower: DB.subjects.lower, upper: DB.subjects.upper };
      const subjectScores = { lower: {}, upper: {} };
      const classTotals = {};
      const topStudents = {};
      DB.students.forEach(student => {
        const level = student.class?.startsWith('P') && parseInt(student.class.slice(1)) >= 4 ? 'upper' : 'lower';
        classTotals[student.class] = (classTotals[student.class] || 0) + 1;
        let total = 0;
        let count = 0;
        [1, 2, 3].forEach(term => {
          const marks = getTermMarks(student.id, term);
          levelSubjects[level].forEach(subject => {
            const mark = marks[subject];
            if (mark && mark.avg !== '' && mark.avg !== undefined && !Number.isNaN(Number(mark.avg))) {
              subjectScores[level][subject] = subjectScores[level][subject] || { total: 0, count: 0 };
              subjectScores[level][subject].total += Number(mark.avg);
              subjectScores[level][subject].count += 1;
              total += Number(mark.avg);
              count += 1;
            }
          });
        });
        if (count && (!topStudents[student.class] || total / count > topStudents[student.class].average)) {
          topStudents[student.class] = { name: student.name, average: Math.round(total / count) };
        }
      });
      const chartData = level => Object.entries(subjectScores[level])
        .filter(([, score]) => score.count)
        .map(([subject, score]) => ({ subject, average: Math.round(score.total / score.count) }))
        .sort((a, b) => b.average - a.average)
        .slice(0, 5);
      const lowerBest = chartData('lower');
      const upperBest = chartData('upper');

      const departmentRole = getAuthentication()?.userRole || 'school_admin';
      const welcomeTitles = {
        school_admin: 'Welcome, School Admin',
        class_teacher: 'Welcome, Class Teacher',
        subject_teacher: 'Welcome, Subject Teacher'
      };
      document.getElementById('pageTitle').textContent = welcomeTitles[departmentRole] || 'Welcome';
      document.getElementById('pageSubtitle').textContent = `${school.name} statistics and academic performance`;
      document.getElementById('contentArea').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
          <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200"><p class="text-sm text-slate-500">Students</p><p class="text-3xl font-bold mt-2">${activeStudents}</p><p class="text-xs text-sky-600 mt-2">Enrolled in this school</p></div>
          <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200"><p class="text-sm text-slate-500">Teachers</p><p class="text-3xl font-bold mt-2">${teachers}</p><p class="text-xs text-emerald-600 mt-2">Teaching staff</p></div>
          <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200"><p class="text-sm text-slate-500">Classes</p><p class="text-3xl font-bold mt-2">${classes.length}</p><p class="text-xs text-violet-600 mt-2">With enrolled students</p></div>
          <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200"><p class="text-sm text-slate-500">School status</p><p class="text-3xl font-bold mt-2">${getAccountStatusLabel(school.accountStatus)}</p><p class="text-xs text-slate-500 mt-2">School account</p></div>
        </div>
        ${renderSystemAnnouncementFeed()}
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-6">
          <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200"><h3 class="text-lg font-bold mb-4">Students by Class</h3><div class="relative h-72"><canvas id="schoolClassChart"></canvas></div></div>
          <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200"><h3 class="text-lg font-bold mb-4">Best Subjects by Level</h3><div class="relative h-72"><canvas id="schoolSubjectChart"></canvas></div></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200"><h3 class="text-lg font-bold mb-4">Best Student per Class</h3><div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">${classes.map(cls => `<div class="border rounded-lg p-4"><p class="text-xs uppercase tracking-wide text-slate-500">${cls}</p><p class="font-semibold mt-1">${topStudents[cls]?.name || 'No marks yet'}</p><p class="text-sm text-emerald-600 mt-1">${topStudents[cls] ? `${topStudents[cls].average}% average` : 'Awaiting marks'}</p></div>`).join('')}</div></div>`;
      if (typeof Chart === 'function') {
        new Chart(document.getElementById('schoolClassChart'), { type: 'bar', data: { labels: classes, datasets: [{ label: 'Students', data: classes.map(cls => classTotals[cls] || 0), backgroundColor: '#0284c7', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
        const subjectLabels = [...lowerBest.map(item => `${item.subject} (Lower)`), ...upperBest.map(item => `${item.subject} (Upper)`)];
        const subjectValues = [...lowerBest.map(item => item.average), ...upperBest.map(item => item.average)];
        new Chart(document.getElementById('schoolSubjectChart'), { type: 'bar', data: { labels: subjectLabels, datasets: [{ label: 'Average %', data: subjectValues, backgroundColor: ['#059669', '#10b981', '#34d399', '#0ea5e9', '#38bdf8'], borderRadius: 4 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, max: 100 } } } });
      }
    }

    function onSubjectTeacherClassChange() {

      const cls = classSelect.value;

      subjectSelect.innerHTML = `<option value="">-- Select Subject --</option>${subjectsToDisplay.map(subject => `<option value="${subject}">${subject}</option>`).join('')}`;

    function loadSubjectTeacherMarks() {
      const cls = document.getElementById('subjectTeacherClass')?.value || '';
      const subject = document.getElementById('subjectTeacherSubject')?.value || '';
      const term = document.getElementById('subjectTeacherTerm')?.value || '1';
      const container = document.getElementById('subjectTeacherMarksContainer');
      if (!container) return;
      if (!cls || !subject) {
        container.textContent = 'Select a class and subject to enter marks.';
        return;
      }
      const students = DB.students.filter(student => student.class === cls);
      const nonGraded = isNonGradedSubject(subject);
      const submission = getSubjectMarkSubmission(cls, term, subject);
      const locked = getMarkWorkflow(cls, term).status !== 'subject-entered' || submission?.status === 'submitted';
      const hasMarks = hasAnySubjectMarks(cls, term, subject);
      container.className = 'border rounded-xl p-4';
      container.innerHTML = `

    function updateSubjectTeacherMark(sid, subject, type, value) {
      const term = document.getElementById('subjectTeacherTerm')?.value || '1';
      const cls = document.getElementById('subjectTeacherClass')?.value || '';
      if (getCurrentSchoolRole() !== 'subject_teacher') {
        showToast('Only the Subject Teacher can edit subject marks.', 'error');
        return;
      }
      if (getMarkWorkflow(cls, term).status !== 'subject-entered' || getSubjectMarkSubmission(cls, term, subject)?.status === 'submitted') {
        showToast('Marks cannot be changed after upload to the Class Teacher.', 'error');
        loadSubjectTeacherMarks();
        return;
      }
      const marks = getTermMarks(sid, term, true);
      if (!marks[subject]) marks[subject] = { bot:'', mot:'', eot:'', avg:'', grade:'' };
      marks[subject][type] = value === '' ? '' : parseFloat(value);
      const mark = marks[subject];
      const entered = [mark.bot, mark.mot, mark.eot].filter(score => score !== '' && score !== null && score !== undefined);
      mark.avg = entered.length ? Math.round(entered.reduce((sum, score) => sum + Number(score), 0) / entered.length) : '';
      mark.grade = isNonGradedSubject(subject) || mark.avg === '' ? '' : getGrade(mark.avg).grade;
      saveAppData();
      const key = encodeURIComponent(subject);
      const avg = document.getElementById(`subject-avg-${sid}-${key}`);
      const grade = document.getElementById(`subject-grade-${sid}-${key}`);
      if (avg) avg.textContent = mark.avg === '' ? '-' : mark.avg;
      if (grade) grade.textContent = isNonGradedSubject(subject) ? '-' : (mark.grade || '-');
      const submitButton = document.getElementById('submitSubjectMarksButton');
      if (submitButton) {
        const ready = hasAnySubjectMarks(cls, term, subject);
        submitButton.disabled = !ready;
        submitButton.className = `px-4 py-2 ${ready ? 'bg-sky-600 hover:bg-sky-700 text-white' : 'bg-slate-200 text-slate-500 cursor-not-allowed'} rounded-lg text-sm font-semibold`;
      }
    }

    function getCompiledMarkListData(selectedClass = document.getElementById('compileClass')?.value || '', selectedTerm = document.getElementById('compileTerm')?.value || '1') {
      const cls = selectedClass;
      if (!cls) return null;
      const term = selectedTerm;
      const students = DB.students.filter(student => student.class === cls);
      const subjects = cls.startsWith('P') && parseInt(cls.slice(1)) >= 4 ? DB.subjects.upper : DB.subjects.lower;
      const requiredSubjects = subjects.filter(subject => !isNonGradedSubject(subject));
      const availableSubjects = requiredSubjects.filter(subject => hasAnySubjectMarks(cls, term, subject));
      const uploadedSubjects = availableSubjects.filter(subject => getSubjectMarkSubmission(cls, term, subject)?.status === 'submitted');
      const rows = students.map(student => {
        const marks = getTermMarks(student.id, term);
        const values = subjects.map(subject => {
          const mark = marks[subject] || {};
          const avg = getAverageMark(mark);
          return { subject, avg, grade: avg === '' || isNonGradedSubject(subject) ? '' : getGrade(avg).grade };
        });
        const gradedValues = values.filter(value => !isNonGradedSubject(value.subject) && value.avg !== '');
        const hasMarks = values.some(value => value.avg !== '');
        const total = values.reduce((sum, value) => sum + (Number(value.avg) || 0), 0);
        const aggregate = gradedValues.reduce((sum, value) => {
          const points = { D1:1, D2:2, C3:3, C4:4, C5:5, C6:6, P7:7, P8:8, F9:9 };
          return sum + (points[value.grade] || 0);
        }, 0);
        return { student, values, hasMarks, total, aggregate };
      });
      return { cls, term, subjects, requiredSubjects, availableSubjects, uploadedSubjects, rows };
    }

    function csvCell(value) {
      return `"${String(value ?? '').replace(/"/g, '""')}"`;
    }

    function isNonGradedSubject(subject) {
      return String(subject).trim().toLowerCase() === 'project work';
    }

    function exportClassMarkListCSV() {
      if (!requireClassTeacherSignature()) return;
      const data = getCompiledMarkListData();
      if (!data) { showToast('Select a class first.', 'error'); return; }
      const headings = ['No.', 'Student', ...data.subjects, 'Total', 'Aggregate', 'Status'];
      const lines = [headings.map(csvCell).join(',')];
      data.rows.forEach((row, index) => {
        lines.push([index + 1, row.student.name, ...row.values.map(value => value.avg === '' ? '' : `${value.avg}${isNonGradedSubject(value.subject) ? ' (Not graded)' : ` (${value.grade || '-'})`}`), row.hasMarks ? row.total : '', row.hasMarks ? row.aggregate : '', row.hasMarks ? 'Has marks' : 'No marks'].map(csvCell).join(','));
      });
      const blob = new Blob([`\uFEFF${lines.join('\r\n')}`], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${data.cls}-term-${data.term}-mark-list.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast('Mark list exported as CSV.', 'success');
    }

    function printClassMarkList() {
      if (!requireClassTeacherSignature()) return;
      const data = getCompiledMarkListData();
      if (!data) { showToast('Select a class first.', 'error'); return; }
      const noMarkCount = data.rows.filter(row => !row.hasMarks).length;
      if (noMarkCount && !confirm(`${noMarkCount} student(s) have no marks. They will remain on the class list but will not receive report cards. Print the list anyway?`)) return;
      document.title = `${data.cls} Term ${data.term} Mark List`;
      document.body.classList.add('printing-mark-list');
      window.print();
      setTimeout(() => document.body.classList.remove('printing-mark-list'), 500);
    }

    function requireClassTeacherSignature() {
      if (canAccessAction(getCurrentSchoolRole(), 'compile_marks') && !getReportSettings().classTeacherSignature) {
        showToast('Class teacher signature is required before exporting or printing.', 'error');
        return false;
      }
      return true;
    }

    function advanceClassMarkList() {
      const role = getCurrentSchoolRole();
      if (!canAccessAction(role, 'compile_marks') || !canAccessAction(role, 'upload_to_admin')) {
        showToast('Your role does not have permission to compile and upload this list.', 'error');
        return;
      }
      const data = getCompiledMarkListData();
      if (!data) { showToast('Select a class first.', 'error'); return; }
      if (!data.rows.length) {
        showToast('This class has no enrolled students to submit.', 'error');
        return;
      }
      if (!data.rows.some(row => row.hasMarks)) {
        showToast('At least one student must have a mark before the class list can be compiled.', 'error');
        return;
      }
      const current = getMarkWorkflow(data.cls, data.term);
      if (current.status !== 'subject-entered') {
        showToast(`This class list is already ${getCurrentMarkWorkflowLabel(data.cls, data.term).toLowerCase()}.`, 'error');
        return;
      }
      const actor = getCurrentUserDisplay();
      if (!setMarkWorkflowStatus(data.cls, data.term, 'class-compiled', role, actor)) return;
      showToast(`${data.cls} Term ${data.term} mark list compiled and uploaded to the school administration.`, 'success');
      loadCompiledMarkList();
    }

    function saveSubscriptionPlan(event, encodedId) {
      event.preventDefault();
      const configuration = getOwnerConfiguration();
      const id = encodedId ? decodeURIComponent(encodedId) : `plan-${Date.now()}`;
      const name = event.target.name.value.trim();
      if (configuration.subscriptionPlans.some(plan => plan.name.toLowerCase() === name.toLowerCase() && plan.id !== id)) {
        showToast('A subscription plan with that name already exists.', 'error');
        return;
      }
      const plan = {
        id,
        name,
        price: Number(event.target.price.value),
        billingPeriod: event.target.billingPeriod.value,
        description: event.target.description.value.trim()
      };
      const index = configuration.subscriptionPlans.findIndex(item => item.id === id);
      if (index >= 0) configuration.subscriptionPlans[index] = plan;
      else configuration.subscriptionPlans.push(plan);
      if (!saveOwnerConfiguration(configuration)) return;
      closeModal();
      renderSubscriptions();
      showToast('Subscription plan saved.', 'success');

      const configuration = getOwnerConfiguration();
      configuration.subscriptionPlans = configuration.subscriptionPlans.filter(plan => plan.id !== id);

      renderSubscriptions();
      showToast('Subscription plan deleted.', 'success');

    function openSystemRoleModal() {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can create roles.', 'error');
        return;
      }
      showModal(`
        <div class="w-full max-w-2xl rounded-xl bg-white p-6">
          <h3 class="text-xl font-bold">Create custom role</h3>
          <p class="mb-5 mt-1 text-sm text-slate-500">Choose a name and the school-system permissions this role needs.</p>

              <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white">Create role</button>
            </div>
          </form>
        </div>`);
    }

    function saveSystemRole(event) {
      event.preventDefault();
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can create roles.', 'error');
        return;
      }
      const name = event.target.name.value.trim();
      const roles = getSystemRoles();
      if (!name || roles.some(role => role.name.toLowerCase() === name.toLowerCase())) {
        showToast('Enter a unique role name.', 'error');
        return;
      }
      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 32) || 'role';
      let id = `custom_${slug}`;
      let suffix = 2;
      while (roles.some(role => role.id === id)) id = `custom_${slug}_${suffix++}`;
      const permissions = [...event.target.querySelectorAll('input[name="permissions"]:checked')].map(input => input.value);
      if (!saveSystemRoleDefinitions([...roles.map(({ id: roleId, name: roleName, permissions: rolePermissions }) => ({
        id: roleId, name: roleName, permissions: rolePermissions
      })), { id, name, permissions }])) return;
      closeModal();
      renderUsersRoles();
      showToast(`${name} role created.`, 'success');
    }

    function saveSystemRolePermissions(event, encodedRoleId) {
      event.preventDefault();
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can update role permissions.', 'error');
        return;
      }
      const roleId = decodeURIComponent(encodedRoleId);
      const permissions = [...event.target.querySelectorAll('input[name="permissions"]:checked')].map(input => input.value);
      const roles = getSystemRoles();
      const target = roles.find(role => role.id === roleId);
      if (!target) {
        showToast('The selected role could not be found.', 'error');
        return;
      }
      const updatedRoles = roles.map(role => ({
        id: role.id,
        name: role.name,
        permissions: role.id === roleId ? permissions : role.permissions
      }));
      if (!saveSystemRoleDefinitions(updatedRoles)) return;
      renderUsersRoles();
      showToast(`Permissions updated for ${target.name}.`, 'success');
    }

    function deleteSystemRole(encodedRoleId) {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can remove roles.', 'error');
        return;
      }
      const roleId = decodeURIComponent(encodedRoleId);
      const role = getSystemRoles().find(item => item.id === roleId);
      if (!role || role.builtIn) {
        showToast('Built-in roles cannot be removed.', 'error');
        return;
      }
      const isAssigned = loadSchoolRegistry().some(school =>
        (school.users || []).some(user => user.role === roleId)
      );
      if (isAssigned) {
        showToast('Reassign all users from this role before removing it.', 'error');
        return;
      }
      if (!window.confirm(`Remove the ${role.name} role?`)) return;
      const remainingRoles = getSystemRoles().filter(item => item.id !== roleId)
        .map(({ id, name, permissions }) => ({ id, name, permissions }));
      if (!saveSystemRoleDefinitions(remainingRoles)) return;
      renderUsersRoles();
      showToast(`${role.name} role removed.`, 'success');
    }

    function assignSystemUserRole(encodedSchoolId, encodedUserId, roleId) {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can assign user roles.', 'error');
        return;
      }
      const schoolId = decodeURIComponent(encodedSchoolId);
      const userId = decodeURIComponent(encodedUserId);
      if (!getSystemRoles().some(role => role.id === roleId)) {
        showToast('Choose a valid role.', 'error');
        renderUsersRoles();
        return;
      }
      const school = getSchoolById(schoolId);
      const account = ensureSchoolUsers(school).find(user => String(user.id) === userId);
      if (!school || !account) {
        showToast('The selected user account could not be found.', 'error');
        renderUsersRoles();
        return;
      }
      account.role = roleId;
      saveSchool(school);
      renderUsersRoles();
      showToast(`${account.name || 'User'} assigned to ${getSystemRoleName(roleId)}.`, 'success');
    }

    function getSystemOwnerUserDirectory() {
      const users = [];
      loadSchoolRegistry().forEach(school => {
        getSchoolDepartmentAccounts(school).forEach(user => {
          users.push({
            id: user.id,
            name: user.name || getSystemRoleName(user.role) || 'School user',
            username: user.username || '',
            role: user.role,
            isSchoolAccount: Boolean(user.isSchoolAccount),
            schoolId: school.id,
            schoolName: school.name || 'Unnamed school',
            district: school.district || '',
            status: user.status || getAccountStatus(school)
          });
        });
      });
      return users;
    }

      renderUserDirectoryRows(getSystemOwnerUserDirectory());

    function saveReportCardTemplate(event, encodedId) {
      event.preventDefault();
      const configuration = getOwnerConfiguration();
      const id = encodedId ? decodeURIComponent(encodedId) : `template-${Date.now()}`;
      const name = event.target.name.value.trim();
      if (configuration.reportCardTemplates.some(template => template.name.toLowerCase() === name.toLowerCase() && template.id !== id)) {
        showToast('A template with that name already exists.', 'error');
        return;
      }
      const template = { id, name, description: event.target.description.value.trim() };
      const index = configuration.reportCardTemplates.findIndex(item => item.id === id);
      if (index >= 0) configuration.reportCardTemplates[index] = template;
      else configuration.reportCardTemplates.push(template);
      if (!saveOwnerConfiguration(configuration)) return;
      closeModal();
      renderTemplates();
      showToast('Report card template saved.', 'success');
    }

    function deleteReportCardTemplate(encodedId) {
      const id = decodeURIComponent(encodedId);
      const configuration = getOwnerConfiguration();
      configuration.reportCardTemplates = configuration.reportCardTemplates.filter(template => template.id !== id);
      if (!saveOwnerConfiguration(configuration)) return;
      renderTemplates();
      showToast('Report card template deleted.', 'success');
    }

    function gradingBandRow(grade = {}) {
      return `<tr class="border-b border-slate-100">
        <td class="p-2"><input type="number" name="min" min="0" max="100" required value="${grade.min ?? ''}" class="w-24 px-2 py-1.5 border border-slate-300 rounded"></td>
        <td class="p-2"><input type="number" name="max" min="0" max="100" required value="${grade.max ?? ''}" class="w-24 px-2 py-1.5 border border-slate-300 rounded"></td>
        <td class="p-2"><input type="text" name="grade" maxlength="12" required value="${escapeHtml(grade.grade || '')}" class="w-28 px-2 py-1.5 border border-slate-300 rounded"></td>
        <td class="p-2"><input type="text" name="remark" maxlength="60" required value="${escapeHtml(grade.remark || '')}" class="w-full min-w-40 px-2 py-1.5 border border-slate-300 rounded"></td>
        <td class="p-2"><button type="button" onclick="this.closest('tr').remove()" class="px-3 py-1.5 text-red-600 hover:bg-red-50 rounded" title="Remove grade band"><i class="fa-solid fa-trash"></i></button></td>
      </tr>`;
    }

    function addGradingBand() {
      document.getElementById('gradingScaleBody')?.insertAdjacentHTML('beforeend', gradingBandRow());
    }

    function saveGradingScale(event) {
      event.preventDefault();
      const rows = [...document.querySelectorAll('#gradingScaleBody tr')];
      const gradeScale = rows.map(row => ({
        min: Number(row.querySelector('[name="min"]').value),
        max: Number(row.querySelector('[name="max"]').value),
        grade: row.querySelector('[name="grade"]').value.trim(),
        remark: row.querySelector('[name="remark"]').value.trim()
      })).sort((left, right) => left.min - right.min);
      if (!gradeScale.length || gradeScale.some(grade => !Number.isInteger(grade.min) || !Number.isInteger(grade.max) || grade.min < 0 || grade.max > 100 || grade.min > grade.max || !grade.grade || !grade.remark)) {
        showToast('Enter a valid range, grade, and remark for every grade band.', 'error');
        return;
      }
      if (gradeScale[0].min !== 0 || gradeScale[gradeScale.length - 1].max !== 100 || gradeScale.some((grade, index) => index > 0 && gradeScale[index - 1].max + 1 !== grade.min)) {
        showToast('Grade ranges must cover 0 through 100 without gaps or overlap.', 'error');
        return;
      }
      const auth = getAuthentication();
      if (auth?.role === 'school' && canAccessAction(auth.userRole, 'manage_grading_scale')) {
        const school = getActiveSchool();
        if (!school) {
          showToast('Active school not found.', 'error');
          return;
        }
        school.gradeScale = gradeScale.map(grade => ({ ...grade }));
        saveSchool(school);
        DB.gradeScale = gradeScale.map(grade => ({ ...grade }));
      } else if (auth?.role === 'admin') {
        const configuration = getOwnerConfiguration();
        configuration.gradeScale = gradeScale;
        if (!saveOwnerConfiguration(configuration)) return;
      } else {
        showToast('Only the System Owner or a user with grading-scale permission can save a grading scale.', 'error');
        return;
      }
      renderGrading();
      showToast('Grading scale saved and applied to report cards.', 'success');
    }
