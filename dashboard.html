        options = getSystemRoles().map(role => [role.id, role.name]);
        helpText = 'Lists available school accounts and their assigned permission roles. Passwords are never included.';
      } else if (type === 'payments') {
        filterLabel = 'Payment status';
        allLabel = 'All payment statuses';
        options = [['pending', 'Pending'], ['submitted', 'Awaiting approval'], ['paid', 'Paid'], ['refunded', 'Refunded']];
        helpText = 'Date range applies to payment date (or paid date when available). Collections total includes paid records only.';
      } else if (type === 'activity') {
        filterLabel = 'Activity category';
        allLabel = 'All categories';
        options = [...new Set(getAuditLogs().map(log => log.category).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b))
          .map(category => [category, category]);
        helpText = 'Date range applies to the audit event timestamp.';
      } else if (type === 'subscriptions') {
        filterLabel = 'Account access';
        allLabel = 'All access statuses';
        options = [['active', 'Active'], ['suspended', 'Suspended'], ['blocked', 'Blocked'], ['expired', 'Expired']];
        helpText = 'Expiry is based on a school expiry date when one is saved; otherwise the account status is reported.';
      } else {
        allLabel = 'All school access statuses';
        options = [['active', 'Active'], ['suspended', 'Suspended'], ['blocked', 'Blocked']];
        helpText = type === 'enrollment'
          ? 'Counts reflect the students, staff, and classes currently saved for each registered school.'
          : 'School registration dates are not recorded, so this report includes all currently registered schools.';
      }

      label.textContent = filterLabel;
      const oldValue = filter.value;
      filter.innerHTML = `<option value="">${escapeHtml(allLabel)}</option>` +
        options.map(([value, text]) => `<option value="${escapeHtml(value)}">${escapeHtml(text)}</option>`).join('');
      if (options.some(([value]) => value === oldValue)) filter.value = oldValue;
      period.classList.toggle('hidden', !['payments', 'activity'].includes(type));
      help.textContent = helpText;
      document.getElementById('printSystemReportButton').disabled = true;
      document.getElementById('systemReportPreview').innerHTML =
        '<div class="rounded-xl border border-dashed border-slate-300 bg-white p-10 text-center text-sm text-slate-500">Generate the report to see an updated preview.</div>';
    }

    function invalidateSystemReportPreview() {
      const printButton = document.getElementById('printSystemReportButton');
      const preview = document.getElementById('systemReportPreview');
      if (!printButton || !preview || printButton.disabled) return;
      printButton.disabled = true;
      preview.innerHTML =
        '<div class="rounded-xl border border-dashed border-slate-300 bg-white p-10 text-center text-sm text-slate-500">Filters changed. Generate the report again to update its preview before printing.</div>';
    }

    function formatSystemReportDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'Unknown date' : date.toLocaleString();
    }

    function getSystemReportDefinition(type) {
      const schools = loadSchoolRegistry();
      const schoolStatus = school => getAccountStatus(school);
      const schoolTier = school => school.paymentMethod && school.paymentMethod !== 'none' ? 'Premium' : 'Basic';
      const accessWithExpiry = school => {
        const status = schoolStatus(school);
        if (status !== 'active') return status;
        const expiry = school.expiryDate ? new Date(school.expiryDate) : null;
        return expiry && Number.isFinite(expiry.getTime()) && expiry < new Date() ? 'expired' : 'active';
      };

      if (type === 'schools') {
        return {
          title: 'School Directory and Access Report',
          columns: ['School', 'District', 'Head teacher', 'Contact', 'Account access', 'Account tier'],
          records: schools.map(school => ({
            status: schoolStatus(school),
            cells: [school.name || 'Unnamed school', school.district || '—', school.headTeacher || '—',
              school.email || school.tel || '—', getAccountStatusLabel(schoolStatus(school)), schoolTier(school)]
          })),
          summary: records => [
            ['Schools listed', records.length],
            ['Active', records.filter(record => record.status === 'active').length],
            ['Suspended or blocked', records.filter(record => ['suspended', 'blocked'].includes(record.status)).length]
          ]
        };
      }
      if (type === 'enrollment') {
        return {
          title: 'School Enrollment and Staffing Report',
          columns: ['School', 'District', 'Access', 'Classes', 'Students', 'Staff'],
          records: schools.map(school => ({
            status: schoolStatus(school),
            students: Array.isArray(school.students) ? school.students.length : 0,
            staff: Array.isArray(school.staff) ? school.staff.length : 0,
            cells: [school.name || 'Unnamed school', school.district || '—', getAccountStatusLabel(schoolStatus(school)),
              Array.isArray(school.classes) ? school.classes.length : 0,
              Array.isArray(school.students) ? school.students.length : 0,
              Array.isArray(school.staff) ? school.staff.length : 0]
          })),
          summary: records => [
            ['Schools listed', records.length],
            ['Students', records.reduce((sum, record) => sum + record.students, 0)],
            ['Staff', records.reduce((sum, record) => sum + record.staff, 0)]
          ]
        };
      }
      if (type === 'subscriptions') {
        return {
          title: 'School Account Access and Expiry Report',
          columns: ['School', 'District', 'Account tier', 'Access status', 'Expiry date'],
          records: schools.map(school => {
            const status = accessWithExpiry(school);
            return {
              status,
              cells: [school.name || 'Unnamed school', school.district || '—', schoolTier(school),
                status === 'expired' ? 'Expired' : getAccountStatusLabel(status),
                school.expiryDate || 'Open-ended / not recorded']
            };
          }),
          summary: records => [
            ['Schools listed', records.length],
            ['Active', records.filter(record => record.status === 'active').length],
            ['Expired', records.filter(record => record.status === 'expired').length]
          ]
        };
      }
      if (type === 'users') {
        const records = schools.flatMap(school => getSchoolDepartmentAccounts(school).map(user => ({
          role: user.role,
          cells: [school.name || 'Unnamed school', user.name || 'Unnamed user', user.username || '—',
            getSystemRoleName(user.role), getAccountStatusLabel(schoolStatus(school))]
        })));
        return {
          title: 'School User Accounts and Roles Report',
          columns: ['School', 'User', 'Username', 'Assigned role', 'School access'],
          records,
          summary: rows => [
            ['User accounts', rows.length],
            ['Roles represented', new Set(rows.map(record => record.role)).size],
            ['Schools represented', new Set(rows.map(record => record.cells[0])).size]
          ]
        };
      }
      if (type === 'payments') {
        const records = getAllPayments().map(payment => ({
          status: payment.status || 'pending',
          date: payment.paidDate || payment.date,
          amount: Number(payment.amount) || 0,
          cells: [
            payment.paidDate || payment.date ? formatSystemReportDate(payment.paidDate || payment.date) : '—',
            payment.schoolName || 'Unknown school',
            payment.paymentCategory || '—',
            payment.status || 'Pending',
            `UGX ${(Number(payment.amount) || 0).toLocaleString()}`,
            payment.txRef || payment.note || '—'
          ]
        }));
        return {
          title: 'Payment History and Collections Report',
          columns: ['Date', 'School', 'Category', 'Status', 'Amount', 'Reference / note'],
          records,
          summary: rows => [
            ['Payment records', rows.length],
            ['Paid collections', `UGX ${rows.filter(record => record.status === 'paid').reduce((sum, record) => sum + record.amount, 0).toLocaleString()}`],
            ['Awaiting approval', rows.filter(record => record.status === 'submitted').length]
          ]
        };
      }
      const records = getAuditLogs().map(log => ({
        date: log.timestamp,
        category: log.category || '—',
        cells: [log.timestamp ? formatSystemReportDate(log.timestamp) : 'Unknown date',
          log.action || '—', log.category || '—', log.actor || 'Unknown user',
          log.role || 'Unknown role', log.school || '—']
      }));
      return {
        title: 'System Activity Report',
        columns: ['Date and time', 'Activity', 'Category', 'User', 'Role', 'School'],
        records,
        summary: rows => [
          ['Activity records', rows.length],
          ['Categories represented', new Set(rows.map(record => record.category).filter(category => category !== '—')).size],
          ['Users represented', new Set(rows.map(record => record.cells[3])).size]
        ]
      };
    }

    function generateSystemReport() {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can generate system reports.', 'error');
        return;
      }
      const type = document.getElementById('systemReportType').value;
      const filterValue = document.getElementById('systemReportFilter').value;
      const fromValue = document.getElementById('systemReportFrom').value;
      const toValue = document.getElementById('systemReportTo').value;
      const usesPeriod = ['payments', 'activity'].includes(type);
      if (usesPeriod && fromValue && toValue && new Date(`${fromValue}T00:00:00`) > new Date(`${toValue}T23:59:59.999`)) {
        showToast('The report start date must be on or before the end date.', 'error');
        return;
      }

      const definition = getSystemReportDefinition(type);
      const filtered = definition.records.filter(record => {
        if (filterValue && type === 'users' && record.role !== filterValue) return false;
        if (filterValue && type === 'activity' && record.category !== filterValue) return false;
        if (filterValue && ['schools', 'enrollment'].includes(type) && record.status !== filterValue) return false;
        if (filterValue && type === 'subscriptions' && record.status !== filterValue) return false;
        if (filterValue && type === 'payments' && record.status !== filterValue) return false;
        if (usesPeriod && (fromValue || toValue)) {
          const date = new Date(record.date || '');
          if (!Number.isFinite(date.getTime())) return false;
          if (fromValue && date < new Date(`${fromValue}T00:00:00`)) return false;
          if (toValue && date > new Date(`${toValue}T23:59:59.999`)) return false;
        }
        return true;
      });
      const summary = definition.summary(filtered);
      const generatedAt = new Date().toLocaleString();
      const periodText = usesPeriod
        ? `Period: ${fromValue || 'Any date'} to ${toValue || 'Any date'}`
        : 'Period: Current saved records';
      const filterText = document.getElementById('systemReportFilter').selectedOptions[0]?.textContent || 'All';
      const sourceNote = 'Source: school, payment, and audit records saved in this browser.';
      document.getElementById('systemReportPreview').innerHTML = `
        <article class="system-report-print-area print-area rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <header class="system-report-heading mb-5 border-b border-slate-200 pb-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-sky-700">KIMS IT SOLUTIONS • SYSTEM OWNER</p>
            <h2 class="mt-2 text-2xl font-bold text-slate-900">${escapeHtml(definition.title)}</h2>
            <p class="mt-2 text-sm text-slate-600">${escapeHtml(periodText)} | Filter: ${escapeHtml(filterText)}</p>
            <p class="mt-1 text-xs text-slate-500">Generated: ${escapeHtml(generatedAt)} · ${escapeHtml(sourceNote)}</p>
          </header>
          <div class="mb-5 grid gap-3 sm:grid-cols-3">
            ${summary.map(([label, value]) => `<div class="rounded-lg border border-slate-200 bg-slate-50 p-3"><p class="text-xs text-slate-500">${escapeHtml(label)}</p><p class="mt-1 font-bold text-slate-900">${escapeHtml(value)}</p></div>`).join('')}
          </div>
          <div class="overflow-x-auto">
            <table class="system-report-table w-full border-collapse text-left text-sm">
              <thead><tr>${definition.columns.map(column => `<th class="border border-slate-300 bg-slate-100 px-3 py-2 font-semibold">${escapeHtml(column)}</th>`).join('')}</tr></thead>
              <tbody>${filtered.length ? filtered.map(record => `<tr>${record.cells.map(cell => `<td class="border border-slate-300 px-3 py-2">${escapeHtml(cell)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${definition.columns.length}" class="border border-slate-300 px-3 py-8 text-center text-slate-500">No records match the selected report filters.</td></tr>`}</tbody>
            </table>
          </div>
          <p class="mt-4 text-xs text-slate-500">${filtered.length} ${filtered.length === 1 ? 'record' : 'records'} included.</p>
        </article>`;
      document.getElementById('printSystemReportButton').disabled = false;
      showToast('System report generated.', 'success');
    }

    function printSystemReport() {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can print system reports.', 'error');
        return;
      }
      const report = document.querySelector('#systemReportPreview .system-report-print-area');
      if (!report) {
        showToast('Generate a report before printing.', 'error');
        return;
      }
      const previousTitle = document.title;
      document.title = report.querySelector('h2')?.textContent || 'KIMS System Report';
      document.body.classList.add('printing-system-report');
      window.addEventListener('afterprint', () => {
        document.title = previousTitle;
        document.body.classList.remove('printing-system-report');
      }, { once: true });
      window.print();
    }

    function renderAuditLogs() {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can view audit logs.', 'error');
        return;
      }
      document.getElementById('pageTitle').textContent = 'Audit Logs';
      document.getElementById('pageSubtitle').textContent = 'Filter, select, clear, and print system activity';
      selectedAuditLogIds = new Set();
      const accounts = new Map();
      getAuditLogs().forEach(log => {
        const key = getAuditAccountKey(log);
        accounts.set(key, {
          actor: log.actor || 'Unknown user',
          role: log.role || 'Unknown role',
          username: log.accountUsername || '',
          school: log.school || ''
        });
      });
      document.getElementById('contentArea').innerHTML = `
        <section class="print-area audit-print-area">
          <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
            <div>
              <h3 class="text-lg font-bold">System Activity</h3>
              <p id="auditLogCount" class="text-sm text-slate-500 mt-1"></p>
            </div>
            <div class="flex flex-wrap items-center gap-2 no-print">
              <button id="auditClearSelected" type="button" onclick="clearSelectedAuditLogs()" disabled class="px-3 py-2 border border-red-300 text-red-700 disabled:opacity-40 rounded-lg text-sm font-semibold">Clear selected (0)</button>
              <button type="button" onclick="clearAllAuditLogs()" class="px-3 py-2 bg-red-700 hover:bg-red-800 text-white rounded-lg text-sm font-semibold">Clear all</button>
              <button type="button" onclick="printAuditLogs('selected')" class="px-3 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-lg text-sm font-semibold">Print selected</button>
              <button type="button" onclick="printAuditLogs('filtered')" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold">Print filtered</button>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 mb-4 no-print">
            <div>
              <label for="auditLogSearch" class="block text-xs font-medium text-slate-600 mb-1">Search logs</label>
              <input id="auditLogSearch" type="search" oninput="renderAuditLogRows()" placeholder="Activity, user, school…" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
              <label for="auditLogAccount" class="block text-xs font-medium text-slate-600 mb-1">Account</label>
              <select id="auditLogAccount" onchange="renderAuditLogRows()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                <option value="">All accounts</option>
                ${[...accounts.entries()].map(([key, account]) => {
                  const label = `${account.actor}${account.username ? ` [${account.username}]` : ''} (${account.role})${account.school ? ` - ${account.school}` : ''}`;
                  return `<option value="${escapeHtml(key)}">${escapeHtml(label)}</option>`;
                }).join('')}
              </select>
            </div>
            <div>
              <label for="auditDateFrom" class="block text-xs font-medium text-slate-600 mb-1">From</label>
              <input id="auditDateFrom" type="date" onchange="renderAuditLogRows()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
              <label for="auditDateTo" class="block text-xs font-medium text-slate-600 mb-1">To</label>
              <input id="auditDateTo" type="date" onchange="renderAuditLogRows()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
          </div>
          <p id="auditPrintDetails" class="audit-print-details text-sm mb-3"></p>
          <div class="overflow-x-auto bg-white border border-slate-200 rounded-lg">
            <table class="w-full text-left text-sm audit-log-table">
              <thead class="bg-slate-100 text-slate-600">
                <tr><th class="px-3 py-3 no-print"><input id="auditSelectVisible" type="checkbox" aria-label="Select all visible audit logs" onchange="toggleVisibleAuditLogs(this.checked)"></th><th class="px-4 py-3 font-semibold">Date &amp; time</th><th class="px-4 py-3 font-semibold">Activity</th><th class="px-4 py-3 font-semibold">Category</th><th class="px-4 py-3 font-semibold">User</th><th class="px-4 py-3 font-semibold">Role</th><th class="px-4 py-3 font-semibold">School</th></tr>
              </thead>
              <tbody id="auditLogRows" class="divide-y divide-slate-200"></tbody>
            </table>
          </div>
        </section>`;
      renderAuditLogRows();
    }

    function getAuditAccountKey(log) {
      return JSON.stringify([log.accountId || '', log.actor || 'Unknown user', log.role || 'Unknown role', log.school || '']);
    }

    function getFilteredAuditLogs() {
      const query = (document.getElementById('auditLogSearch')?.value || '').trim().toLowerCase();
      const accountKey = document.getElementById('auditLogAccount')?.value || '';
      const fromValue = document.getElementById('auditDateFrom')?.value || '';
      const toValue = document.getElementById('auditDateTo')?.value || '';
      const fromDate = fromValue ? new Date(`${fromValue}T00:00:00`) : null;
      const toDate = toValue ? new Date(`${toValue}T23:59:59.999`) : null;

      return getAuditLogs().filter(log => {
        const date = new Date(log.timestamp);
        const matchesQuery = !query || [log.action, log.category, log.actor, log.accountUsername, log.role, log.school, log.timestamp]
          .some(value => String(value || '').toLowerCase().includes(query));
        const matchesAccount = !accountKey || getAuditAccountKey(log) === accountKey;
        const matchesFromDate = !fromDate || (Number.isFinite(date.getTime()) && date >= fromDate);
        const matchesToDate = !toDate || (Number.isFinite(date.getTime()) && date <= toDate);
        return matchesQuery && matchesAccount && matchesFromDate && matchesToDate;
      }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    }

    function renderAuditLogRows() {
      const rows = document.getElementById('auditLogRows');
      if (!rows) return;
      let logs = getFilteredAuditLogs();
      if (auditPrintLogIds) {
        const printIds = new Set(auditPrintLogIds);
        logs = logs.filter(log => printIds.has(String(log.id)));
      }
      document.getElementById('auditLogCount').textContent = `${logs.length} ${logs.length === 1 ? 'record' : 'records'}`;
      rows.innerHTML = logs.length ? logs.map(log => {
        const date = new Date(log.timestamp);
        const timestamp = Number.isNaN(date.getTime()) ? 'Unknown date' : date.toLocaleString();
        return `<tr>
          <td class="px-3 py-3 no-print"><input type="checkbox" data-audit-log-id="${escapeHtml(log.id)}" aria-label="Select audit log for ${escapeHtml(log.action)}" ${selectedAuditLogIds.has(String(log.id)) ? 'checked' : ''}></td>
          <td class="px-4 py-3 whitespace-nowrap">${escapeHtml(timestamp)}</td>
          <td class="px-4 py-3 font-medium text-slate-800">${escapeHtml(log.action)}</td>
          <td class="px-4 py-3">${escapeHtml(log.category)}</td>
          <td class="px-4 py-3">${escapeHtml(log.actor)}</td>
          <td class="px-4 py-3">${escapeHtml(log.role)}</td>
          <td class="px-4 py-3">${escapeHtml(log.school || '—')}</td>
        </tr>`;
      }).join('') : '<tr><td colspan="7" class="px-4 py-10 text-center text-slate-500">No audit records match these filters.</td></tr>';
      rows.querySelectorAll('[data-audit-log-id]').forEach(checkbox => {
        checkbox.addEventListener('change', () => {
          const id = checkbox.dataset.auditLogId;
          if (checkbox.checked) selectedAuditLogIds.add(id);
          else selectedAuditLogIds.delete(id);
          updateAuditSelectionControls(logs);
        });
      });
      updateAuditSelectionControls(logs);
    }

    function updateAuditSelectionControls(visibleLogs = getFilteredAuditLogs()) {
      const clearButton = document.getElementById('auditClearSelected');
      const selectVisible = document.getElementById('auditSelectVisible');
      if (clearButton) {
        clearButton.textContent = `Clear selected (${selectedAuditLogIds.size})`;
        clearButton.disabled = selectedAuditLogIds.size === 0;
      }
      if (selectVisible) {
        selectVisible.checked = visibleLogs.length > 0 && visibleLogs.every(log => selectedAuditLogIds.has(String(log.id)));
        selectVisible.indeterminate = visibleLogs.some(log => selectedAuditLogIds.has(String(log.id))) && !selectVisible.checked;
      }
    }

    function toggleVisibleAuditLogs(checked) {
      getFilteredAuditLogs().forEach(log => {
        if (checked) selectedAuditLogIds.add(String(log.id));
        else selectedAuditLogIds.delete(String(log.id));
      });
      renderAuditLogRows();
    }

    function clearSelectedAuditLogs() {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can clear audit logs.', 'error');
        return;
      }
      const ids = [...selectedAuditLogIds];
      if (!ids.length) return;
      if (!confirm(`Clear ${ids.length} selected audit ${ids.length === 1 ? 'record' : 'records'}? This cannot be undone.`)) return;
      const deletedCount = deleteAuditLogs(ids);
      selectedAuditLogIds.clear();
      renderAuditLogRows();
      showToast(`${deletedCount} audit ${deletedCount === 1 ? 'record' : 'records'} cleared.`, 'success');
    }

    function clearAllAuditLogs() {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can clear audit logs.', 'error');
        return;
      }
      const logCount = getAuditLogs().length;
      if (!logCount) {
        showToast('There are no audit logs to clear.', 'info');
        return;
      }
      if (!confirm(`Clear all ${logCount} audit records? This cannot be undone.`)) return;
      const deletedCount = deleteAuditLogs();
      selectedAuditLogIds.clear();
      renderAuditLogs();
      showToast(`${deletedCount} audit records cleared.`, 'success');
    }

    function printAuditLogs(mode = 'filtered') {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can print audit logs.', 'error');
        return;
      }
      const filteredLogs = getFilteredAuditLogs();
      const logs = mode === 'selected'
        ? filteredLogs.filter(log => selectedAuditLogIds.has(String(log.id)))
        : filteredLogs;
      if (!logs.length) {
        showToast(mode === 'selected' ? 'Select at least one visible audit record to print.' : 'There are no filtered audit records to print.', 'info');
        return;
      }
      auditPrintLogIds = logs.map(log => String(log.id));
      const from = document.getElementById('auditDateFrom')?.value || 'Any date';
      const to = document.getElementById('auditDateTo')?.value || 'Any date';
      const accountSelect = document.getElementById('auditLogAccount');
      const accountLabel = accountSelect?.selectedOptions[0]?.textContent || 'All accounts';
      document.getElementById('auditPrintDetails').textContent = `Period: ${from} to ${to} | Account: ${accountLabel} | ${logs.length} records`;
      recordAuditEvent('Audit logs printed', 'Audit Logs');
      renderAuditLogRows();
      window.addEventListener('afterprint', () => {
        auditPrintLogIds = null;
        document.getElementById('auditPrintDetails').textContent = '';
        renderAuditLogRows();
      }, { once: true });
      window.print();
    }

          <div class="space-y-6">

      const openCount = tickets.filter(ticket => ['open', 'in_progress'].includes(ticket.status)).length;
      const waitingCount = tickets.filter(ticket => ticket.status === 'waiting_school').length;
      const resolvedCount = tickets.filter(ticket => ['resolved', 'closed'].includes(ticket.status)).length;

          <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="mb-5">
              <h3 class="text-lg font-bold">Support inbox</h3>
              <p class="mt-1 text-sm text-slate-500">Review school requests, update priority or status, and reply in the ticket thread. Tickets are stored in this browser and do not synchronize across devices.</p>

            <div class="mb-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
              <div class="xl:col-span-2"><label for="ownerSupportSearch" class="mb-1 block text-sm font-medium">Search tickets</label><input id="ownerSupportSearch" type="search" oninput="renderOwnerSupportTicketRows()" placeholder="Ticket, school, requester or subject" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></div>
              <div><label for="ownerSupportStatus" class="mb-1 block text-sm font-medium">Status</label><select id="ownerSupportStatus" onchange="renderOwnerSupportTicketRows()" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="">All statuses</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="waiting_school">Waiting for school</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div>
              <div><label for="ownerSupportPriority" class="mb-1 block text-sm font-medium">Priority</label><select id="ownerSupportPriority" onchange="renderOwnerSupportTicketRows()" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"><option value="">All priorities</option><option value="urgent">Urgent</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select></div>
            </div>

    function getSupportTicketStatusLabel(status) {
      return ({
        open: 'Open',
        in_progress: 'In progress',
        waiting_school: 'Waiting for school',
        resolved: 'Resolved',
        closed: 'Closed'
      })[status] || 'Open';
    }

    function getSupportTicketCategoryLabel(category) {
      return ({
        account_access: 'Account access',
        students: 'Students and staff',
        marks_reports: 'Marks and reports',
        payments: 'Payments',
        technical: 'Technical issue',
        other: 'Other'
      })[category] || 'Other';
    }

    function getSupportTicketDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'Unknown date' : date.toLocaleString();
    }

    function renderSchoolSupportTicketCards(tickets) {
      if (!tickets.length) return '<p class="rounded-lg border border-dashed border-slate-300 p-6 text-center text-sm text-slate-500">Your school has not submitted any tickets yet.</p>';
      return [...tickets].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)).map(ticket => `
        <article class="flex flex-wrap items-center justify-between gap-3 rounded-lg border border-slate-200 p-4">
          <div class="min-w-0"><h4 class="font-semibold">${escapeHtml(ticket.subject)}</h4><p class="mt-1 text-xs text-slate-500">${escapeHtml(getSupportTicketCategoryLabel(ticket.category))} · ${escapeHtml(ticket.priority)} priority · Updated ${escapeHtml(getSupportTicketDate(ticket.updatedAt))}</p></div>
          <div class="flex items-center gap-3"><span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold">${escapeHtml(getSupportTicketStatusLabel(ticket.status))}</span><button type="button" onclick="openSupportTicket('${encodeURIComponent(String(ticket.id))}')" class="rounded-lg border border-sky-200 px-3 py-1.5 text-xs font-semibold text-sky-700 hover:bg-sky-50">View / reply</button></div>
        </article>`).join('');
    }

    function submitSupportTicket(event) {
      event.preventDefault();
      const form = event.target;
      const ticket = createSupportTicket({
        subject: form.elements.ticketSubject.value,
        category: form.elements.ticketCategory.value,
        priority: form.elements.ticketPriority.value,
        message: form.elements.ticketMessage.value
      });
      if (!ticket) return;
      renderSupportCenter();
      showToast('Support ticket submitted. You can follow replies from this page.', 'success');
    }

    function renderOwnerSupportTicketRows() {
      const rows = document.getElementById('ownerSupportTicketRows');
      if (!rows) return;
      const allTickets = getSupportTickets();
      const query = (document.getElementById('ownerSupportSearch')?.value || '').trim().toLowerCase();
      const status = document.getElementById('ownerSupportStatus')?.value || '';
      const priority = document.getElementById('ownerSupportPriority')?.value || '';
      const filtered = allTickets.filter(ticket => {
        const searchable = [ticket.id, ticket.subject, ticket.schoolName, ticket.requester, ticket.description]
          .join(' ').toLowerCase();
        return (!query || searchable.includes(query)) &&
          (!status || ticket.status === status) &&
          (!priority || ticket.priority === priority);
      }).sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      rows.innerHTML = filtered.map(ticket => {
        const encodedId = encodeURIComponent(String(ticket.id));
        const priorityClass = ticket.priority === 'urgent' ? 'bg-red-100 text-red-800'
          : ticket.priority === 'high' ? 'bg-amber-100 text-amber-800'
            : 'bg-slate-100 text-slate-700';
        const statusClass = ticket.status === 'resolved' || ticket.status === 'closed'
          ? 'bg-emerald-100 text-emerald-800'
          : ticket.status === 'waiting_school' ? 'bg-violet-100 text-violet-800'
            : 'bg-sky-100 text-sky-800';
        return `<tr class="border-b border-slate-100 align-top">
          <td class="p-3"><span class="font-semibold">${escapeHtml(ticket.subject)}</span><span class="mt-1 block text-xs text-slate-500">#${escapeHtml(ticket.id)}</span></td>
          <td class="p-3"><span class="font-medium">${escapeHtml(ticket.schoolName)}</span><span class="mt-1 block text-xs text-slate-500">${escapeHtml(ticket.requester)} · ${escapeHtml(ticket.requesterRole)}</span></td>

    function openSupportTicket(encodedId) {

        showToast('The selected support ticket could not be found or accessed.', 'error');

            ${messages.map(message => `<article class="rounded-lg border border-slate-200 bg-white p-4"><div class="mb-2 flex flex-wrap justify-between gap-2"><strong>${escapeHtml(message.author)} · ${escapeHtml(message.authorRole)}</strong><span class="text-xs text-slate-500">${escapeHtml(getSupportTicketDate(message.createdAt))}</span></div><p class="whitespace-pre-wrap text-sm text-slate-700">${escapeHtml(message.message)}</p></article>`).join('')}
          </section>
          ${isOwner ? `
            <form onsubmit="saveSupportTicketManagement(event, '${encodeURIComponent(ticketId)}')" class="mt-5 grid gap-3 sm:grid-cols-2">
              <div><label class="mb-1 block text-sm font-medium">Status</label><select name="ticketStatus" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">${[['open','Open'],['in_progress','In progress'],['waiting_school','Waiting for school'],['resolved','Resolved'],['closed','Closed']].map(([value,label]) => `<option value="${value}" ${ticket.status === value ? 'selected' : ''}>${label}</option>`).join('')}</select></div>
              <div><label class="mb-1 block text-sm font-medium">Priority</label><select name="ticketPriority" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">${[['low','Low'],['normal','Normal'],['high','High'],['urgent','Urgent']].map(([value,label]) => `<option value="${value}" ${ticket.priority === value ? 'selected' : ''}>${label}</option>`).join('')}</select></div>
              <div class="flex justify-end gap-2 sm:col-span-2"><button type="button" onclick="closeModal()" class="rounded-lg border border-slate-300 px-4 py-2 text-sm">Close</button><button type="submit" class="rounded-lg bg-slate-800 px-4 py-2 text-sm font-semibold text-white">Save ticket status</button></div>
            </form>` : ''}
          <form onsubmit="replyToSupportTicket(event, '${encodeURIComponent(ticketId)}')" class="mt-4 space-y-3">
            <label for="supportTicketReply" class="block text-sm font-medium">${isOwner ? 'Reply to school' : 'Reply to support'}</label>
            <textarea id="supportTicketReply" name="ticketReply" rows="3" maxlength="4000" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Write a reply for this ticket thread"></textarea>
            <div class="flex justify-end gap-2"><button type="button" onclick="closeModal()" class="rounded-lg border border-slate-300 px-4 py-2 text-sm">Cancel</button><button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white">Send reply</button></div>
          </form>
        </div>`);
    }

    function saveSupportTicketManagement(event, encodedId) {
      event.preventDefault();
      const form = event.target;
      const ticketId = decodeURIComponent(encodedId);
      if (!updateSupportTicket(ticketId, {
        status: form.elements.ticketStatus.value,
        priority: form.elements.ticketPriority.value
      })) return;
      closeModal();
      renderSupportCenter();
      showToast('Support ticket updated.', 'success');
    }

    function replyToSupportTicket(event, encodedId) {
      event.preventDefault();
      const ticketId = decodeURIComponent(encodedId);
      if (!addSupportTicketReply(ticketId, event.target.elements.ticketReply.value)) return;
      closeModal();
      renderSupportCenter();
      showToast('Reply added to the support ticket.', 'success');
    }

    function removeSupportTicket(encodedId) {
      const ticketId = decodeURIComponent(encodedId);
      const ticket = getSupportTickets().find(item => String(item.id) === ticketId);
      if (!ticket) {
        showToast('The selected support ticket could not be found.', 'error');
        return;
      }
      if (!confirm(`Permanently delete ticket "${ticket.subject}"?`)) return;
      if (!deleteSupportTicket(ticketId)) return;
      renderSupportCenter();
      showToast('Support ticket deleted.', 'success');
    }

    function toAnnouncementDateTimeInput(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

        startsAt: toAnnouncementDateTimeInput(announcement?.startsAt || now),
        expiresAt: toAnnouncementDateTimeInput(announcement?.expiresAt || new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000))
      };

    function setSystemAnnouncementForm(announcement = null) {
      const form = document.getElementById('systemAnnouncementForm');
      if (!form) return;
      const defaults = announcementFormDefaults(announcement);
      form.elements.title.value = defaults.title;
      form.elements.message.value = defaults.message;
      form.elements.startsAt.value = defaults.startsAt;
      form.elements.expiresAt.value = defaults.expiresAt;
      form.elements.currentImages.value = JSON.stringify(defaults.imageDataUrls);
      form.elements.image.value = '';
      form.elements.removeImage.checked = false;
      document.getElementById('announcementFormHeading').textContent = announcement ? 'Edit Announcement' : 'New Announcement';
      document.getElementById('announcementSubmitButton').textContent = announcement ? 'Save Changes' : 'Publish Announcement';
      document.getElementById('announcementCancelEdit').classList.toggle('hidden', !announcement);
      const hasSavedImages = defaults.imageDataUrls.length > 0;
      document.getElementById('announcementRemoveImageWrap').classList.toggle('hidden', !hasSavedImages);
      document.getElementById('announcementRemoveImageWrap').classList.toggle('flex', hasSavedImages);
      form.dataset.editingId = announcement ? String(announcement.id) : '';
    }

    function readAnnouncementImage(file) {
      if (!file) return Promise.resolve('');
      if (!file.type.startsWith('image/')) {
        return Promise.reject(new Error('Choose a valid image file.'));
      }
      if (file.size > 10 * 1024 * 1024) {
        return Promise.reject(new Error('The image must be 10 MB or smaller.'));
      }
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result !== 'string') {
            reject(new Error('The selected image could not be read.'));
            return;
          }
          const image = new Image();
          image.onload = () => {
            const maxWidth = 1800;
            const maxHeight = 2400;
            const scale = Math.min(1, maxWidth / image.naturalWidth, maxHeight / image.naturalHeight);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            const context = canvas.getContext('2d');
            if (!context) {
              reject(new Error('Your browser could not prepare the image. Try another image.'));
              return;
            }
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            const qualities = [0.82, 0.74, 0.66, 0.58, 0.5];
            const webpPreview = canvas.toDataURL('image/webp', qualities[0]);
            const outputType = webpPreview.startsWith('data:image/webp;')
              ? 'image/webp'
              : 'image/jpeg';
            const compressed = [webpPreview, ...qualities.slice(1).map(quality => canvas.toDataURL(outputType, quality))]
              .find(dataUrl => dataUrl.length <= 200 * 1024);
            if (!compressed) {
              reject(new Error('This image is still too large to save. Try a smaller image file.'));
              return;
            }
            resolve(compressed);
          };
          image.onerror = () => reject(new Error('This image format could not be opened. Try a JPEG, PNG, or WebP image.'));
          image.src = reader.result;
        };
        reader.onerror = () => reject(new Error('The selected image could not be read.'));
        reader.readAsDataURL(file);
      });
    }

    async function publishSystemAnnouncement(e) {
      e.preventDefault();
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can manage announcements.', 'error');
        return;
      }
      const form = e.target;
      const imageFiles = [...form.elements.image.files];
      let existingImages = [];
      try {
        existingImages = JSON.parse(form.elements.currentImages.value || '[]');
      } catch {
        showToast('The saved flyer list could not be loaded. Refresh and try again.', 'error');
        return;
      }
      if (!Array.isArray(existingImages)) existingImages = [];
      if (form.elements.removeImage.checked) existingImages = [];
      if (existingImages.length + imageFiles.length > 8) {
        showToast('An announcement can contain up to 8 flyers. Remove saved flyers or choose fewer new images.', 'error');
        return;
      }

      const submitButton = document.getElementById('announcementSubmitButton');
      submitButton.disabled = true;
      submitButton.textContent = 'Preparing images...';
      let uploadedImages;
      try {
        uploadedImages = await Promise.all(imageFiles.map(readAnnouncementImage));
      } catch (error) {
        showToast(error.message, 'error');
        submitButton.disabled = false;
        submitButton.textContent = form.dataset.editingId ? 'Save Changes' : 'Publish Announcement';
        return;
      }

      const imageDataUrls = [...existingImages, ...uploadedImages];
      const data = {
        title: form.elements.title.value || imageFiles[0]?.name.replace(/\.[^.]+$/, '') || (imageDataUrls.length ? 'School flyer' : ''),
        message: form.elements.message.value,
        imageDataUrls,
        startsAt: form.elements.startsAt.value,
        expiresAt: form.elements.expiresAt.value
      };
      const editingId = form.dataset.editingId;
      let success;
      try {
        success = editingId
          ? updateSystemAnnouncement(editingId, data)
          : Boolean(addSystemAnnouncement(data));
      } catch (error) {
        console.error('Could not save system announcement:', error);
        showToast('The announcement could not be saved. Check available browser storage and try again.', 'error');
        submitButton.disabled = false;
        submitButton.textContent = editingId ? 'Save Changes' : 'Publish Announcement';
        return;
      }
      if (!success) {
        showToast('Add a message or image, and choose a stop date after the start date.', 'error');
        submitButton.disabled = false;
        submitButton.textContent = editingId ? 'Save Changes' : 'Publish Announcement';
        return;
      }
      scheduleSystemAnnouncementRefresh();
      renderAnnouncements();
      showToast(editingId ? 'Announcement updated successfully.' : 'Announcement published successfully.', 'success');
    }

    function renderPublishedAnnouncements() {
      const container = document.getElementById('publishedAnnouncements');
      if (!container) return;
      const announcements = getSystemAnnouncements();
      const count = document.getElementById('publishedAnnouncementCount');
      if (count) count.textContent = `${announcements.length} total`;
      const now = Date.now();
      container.innerHTML = announcements.length ? announcements.map(announcement => {
        const date = new Date(announcement.createdAt);
        const publishedAt = Number.isNaN(date.getTime()) ? 'Unknown date' : date.toLocaleString();
        const startsAt = new Date(announcement.startsAt);
        const expiresAt = new Date(announcement.expiresAt);
        const isScheduled = Number.isFinite(startsAt.getTime()) && startsAt.getTime() > now;
        const hasExpired = Number.isFinite(expiresAt.getTime()) && expiresAt.getTime() <= now;
        const status = isScheduled ? 'Scheduled' : hasExpired ? 'Expired' : 'Displaying';
        const statusStyle = isScheduled ? 'bg-amber-100 text-amber-800' : hasExpired ? 'bg-slate-100 text-slate-600' : 'bg-emerald-100 text-emerald-800';
        const announcementId = escapeHtml(announcement.id);
        return `<article class="bg-white border border-slate-200 rounded-lg p-5">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div>
              <h4 class="font-semibold text-slate-800">${escapeHtml(announcement.title)}</h4>
              <time class="text-xs text-slate-500">${escapeHtml(publishedAt)}</time>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs px-2 py-1 rounded-full ${statusStyle}">${status}</span>
              <button type="button" onclick="editSystemAnnouncement('${announcementId}')" class="text-sm font-medium text-sky-700 hover:text-sky-900 underline">Edit</button>
              <button type="button" onclick="deleteSystemAnnouncement('${announcementId}')" class="text-sm font-medium text-red-700 hover:text-red-900 underline">Delete</button>
            </div>
          </div>
          ${announcement.message ? `<p class="text-sm text-slate-600 mt-2 whitespace-pre-wrap">${escapeHtml(announcement.message)}</p>` : ''}
          ${renderSystemAnnouncementImage(announcement)}
          ${!announcement.message && getSystemAnnouncementImages(announcement).length ? '<p class="text-sm text-slate-600 mt-2">See the attached flyer for details.</p>' : ''}
          <p class="text-xs text-slate-500 mt-3">Display period: ${Number.isNaN(startsAt.getTime()) ? 'Unknown' : escapeHtml(startsAt.toLocaleString())} - ${Number.isNaN(expiresAt.getTime()) ? 'Unknown' : escapeHtml(expiresAt.toLocaleString())}</p>
          <p class="text-xs text-slate-400 mt-3">Published by ${escapeHtml(announcement.createdBy || 'System Owner')}</p>
        </article>`;
      }).join('') : '<div class="bg-white border border-slate-200 rounded-lg p-6 text-sm text-slate-500">No announcements have been published yet.</div>';
    }

    function editSystemAnnouncement(announcementId) {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can manage announcements.', 'error');
        return;
      }
      const announcement = getSystemAnnouncements().find(item => String(item.id) === String(announcementId));
      if (!announcement) {
        showToast('This announcement could not be found.', 'error');
        return;
      }
      setSystemAnnouncementForm(announcement);
      document.getElementById('systemAnnouncementForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function deleteSystemAnnouncement(announcementId) {
      if (getAuthentication()?.role !== 'admin') {
        showToast('Only the System Owner can manage announcements.', 'error');
        return;
      }
      if (!confirm('Delete this announcement for all users?')) return;
      try {
        if (!removeSystemAnnouncement(announcementId)) {
          showToast('This announcement could not be deleted.', 'error');
          return;
        }
      } catch (error) {
        console.error('Could not delete system announcement:', error);
        showToast('The announcement could not be deleted. Check available browser storage and try again.', 'error');
        return;
      }
      scheduleSystemAnnouncementRefresh();
      renderPublishedAnnouncements();
      showToast('Announcement deleted.', 'success');
    }

    async function adminSetSchoolStatus(id, status) {
      const schools = loadSchoolRegistry();
      const school = schools.find(s => String(s.id) === String(id));
      if (!school) return;
      const actionText = status === 'blocked' ? 'block' : status === 'suspended' ? 'suspend' : 'reactivate';
      if (!confirm(`Are you sure you want to ${actionText} ${school.name}?`)) return;
      const previousStatus = school.accountStatus;
      school.accountStatus = status;
      try {
        await saveManagedSchool(school);
        renderSchools();
        showToast(`${school.name} marked as ${status === 'blocked' ? 'Blocked' : status === 'suspended' ? 'Suspended' : 'Active'}.`, 'success');
      } catch (error) {
        school.accountStatus = previousStatus;
        console.error('Could not update school access status:', error);
        showToast(`Could not update school status: ${error.message}`, 'error');
      }
    }

    async function saveSchoolEdits(e, id) {
      e.preventDefault();
      const schools = loadSchoolRegistry();
      const school = schools.find(s => String(s.id) === String(id));
      if (!school) return;
      const form = e.currentTarget || e.target;
      const value = name => form.elements.namedItem(name)?.value.trim() || '';
      const previous = { ...school };
      school.name = value('name');
      school.district = value('district');
      school.headTeacher = value('headTeacher');
      school.tel = value('tel');
      school.email = value('email');
      school.poBox = value('poBox');
      school.motto = value('motto');
      school.accountStatus = value('accountStatus');
      if (!school.name || !school.district) {
        Object.assign(school, previous);
        showToast('School name and district are required.', 'error');
        return;
      }
      try {
        await saveManagedSchool(school);
        closeModal();
        renderSchools();
        showToast('School updated successfully.', 'success');
      } catch (error) {
        Object.assign(school, previous);
        console.error('Could not save school changes:', error);
        showToast(`Could not save school changes: ${error.message}`, 'error');
      }
    }

    async function adminDeleteSchool(id) {
      const school = loadSchoolRegistry().find(s => String(s.id) === String(id));
      if (!school) return;
      if (!confirm(`Permanently delete ${school.name} and all its data?`)) return;
      try {
        await deleteManagedSchool(id);
        renderSchools();
        showToast('School removed.', 'success');
      } catch (error) {
        console.error('Could not delete school:', error);
        showToast(`Could not delete school: ${error.message}`, 'error');
      }
    }

    function getTermMarks(sid, term, create = false) {
      const termKey = String(term || '1');
      let studentMarks = DB.marks[sid];
      if (!studentMarks) {
        if (!create) return {};
        studentMarks = DB.marks[sid] = { terms: {} };
      }
      if (studentMarks.terms && typeof studentMarks.terms === 'object') {
        if (!studentMarks.terms[termKey] && create) studentMarks.terms[termKey] = {};
        return studentMarks.terms[termKey] || {};
      }
      if (termKey === '1') return studentMarks;
      if (!create) return {};
      const legacyMarks = { ...studentMarks };
      studentMarks.terms = { '1': legacyMarks, [termKey]: {} };
      return studentMarks.terms[termKey];
    }

      const subjects = cls.startsWith('P') && parseInt(cls.slice(1)) >= 4 ? DB.subjects.upper : DB.subjects.lower;
      const headings = ['No.', 'Student', 'Subject', 'Exam Type', 'Mark', 'Average', 'Grade'];
      const lines = [headings.map(csvCell).join(',')];
      students.forEach((student, index) => {
        const marks = getTermMarks(student.id, term);
        subjects.forEach(subject => {
          const mark = marks[subject] || {};
          [['BOT', mark.bot], ['MID', mark.mot], ['END', mark.eot]].forEach(([examType, score]) => {
            if (score !== '' && score !== null && score !== undefined) {
              lines.push([index + 1, student.name, subject, examType, score, mark.avg ?? '', isNonGradedSubject(subject) ? '' : (mark.grade || '')].map(csvCell).join(','));
            }
          });
        });
      });
      const blob = new Blob([`\uFEFF${lines.join('\r\n')}`], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${cls}-term-${term}-marks-entry.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast(`${lines.length - 1} filled exam mark(s) exported as CSV.`, 'success');
    }

      const cls = document.getElementById('marksClass')?.value || '';
      const term = document.getElementById('marksTerm')?.value || '1';
      if (!cls) { showToast('Select a class first.', 'error'); return; }
      document.title = `${cls} Term ${term} Marks Entry`;
      document.body.classList.add('printing-marks-entry');
      window.print();
      setTimeout(() => document.body.classList.remove('printing-marks-entry'), 500);
    }

    function updateMark(sid, subj, type, val) {
      const role = getCurrentSchoolRole();
      const term = document.getElementById('marksTerm')?.value || '1';
      const existingValue = getTermMarks(sid, term)[subj]?.[type];
      const hasExistingValue = existingValue !== undefined && existingValue !== null && existingValue !== '';
      if ((hasExistingValue && !canAccessAction(role, 'edit_marks')) ||
          (!hasExistingValue && !canAccessAction(role, 'enter_marks'))) {
        showToast('Your role does not have permission to enter or edit marks.', 'error');
        return;
      }
      const termMarks = getTermMarks(sid, term, true);
      if (!termMarks[subj]) termMarks[subj] = {bot:'',mot:'',eot:''};
      termMarks[subj][type] = val === '' ? '' : parseFloat(val);
      const m   = termMarks[subj];
      const avg = getAverageMark(m);
      const gd  = isNonGradedSubject(subj) || avg === '' ? null : getGrade(avg);
      m.avg = avg; m.grade = gd ? gd.grade : '';
      saveAppData();
      if (getAverageMark(m) !== '') {
        const school = getActiveSchool();
        const student = DB.students.find(item => item.id === sid);
        if (school && student) {
          school.subjectMarkSubmissions = school.subjectMarkSubmissions || {};
          school.subjectMarkSubmissions[getSubjectSubmissionKey(student.class, term, subj)] = {
            status: 'submitted',
            submittedAt: new Date().toISOString(),
            submittedBy: getCurrentUserDisplay(),
            source: 'school-entry'
          };
          saveSchool(school);
        }
      }
      const te = document.getElementById(`total-${sid}-${subj}`);
      const ge = document.getElementById(`grade-${sid}-${subj}`);
      if (te) te.textContent = avg === '' ? '-' : avg;
      if (ge) ge.textContent = gd ? gd.grade : '-';
      const student = DB.students.find(s => s.id === sid);
      const subjects = student ? (student.class.startsWith('P') && parseInt(student.class.slice(1)) >= 4 ? DB.subjects.upper : DB.subjects.lower) : Object.keys(termMarks);
      const totals = computeStudentTotals(sid, subjects, term);
      const stuTotalEl = document.getElementById(`student-total-${sid}`);
      const stuAggEl   = document.getElementById(`student-agg-${sid}`);
      if (stuTotalEl) stuTotalEl.textContent = totals.count ? totals.total : '-';
      if (stuAggEl)   stuAggEl.textContent   = totals.count ? totals.agg : '-';
    }

    function computeStudentTotals(sid, subjects, term = null) {
      const marks = getTermMarks(sid, term || document.getElementById('marksTerm')?.value || '1');
      let total = 0;
      let agg = 0;
      let count = 0;
      let pending = false;
      subjects.forEach(subj => {
        const m = marks[subj];
        if (m && m.avg !== undefined && m.avg !== '' && !Number.isNaN(Number(m.avg))) {
          const avg = Number(m.avg);
          total += avg;
          if (!isNonGradedSubject(subj)) {
            count += 1;
            const grade = getGrade(avg).grade;
            const gp = {D1:1,D2:2,C3:3,C4:4,C5:5,C6:6,P7:7,P8:8,F9:9}[grade] || 9;
            agg += gp;
          }
          if (!m.approved) pending = true;
        }
      });
      const state = count === 0 ? '-' : pending ? 'Pending Approval' : 'Approved';
      return { total, agg, count, state };
    }

    function submitReportFeePayment() {
      const school = getActiveSchool();

      if (!school || getCurrentSchoolRole() !== 'school_admin') {
        showToast('Only the School Admin can submit the service-fee payment.', 'error');

      if (!reference) {

    function getBorderArtDataUrl(name) {
      if (!name || name === 'none') return '';
      // Simple inline SVG presets for border art (small repeating patterns)
      if (name === 'floral') {
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="40"><defs><pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="%23fff"/><path d="M10 20c5-10 15-10 20 0" stroke="%230369a1" stroke-width="2" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(%23p)"/></svg>`);
      }
      if (name === 'geometric') {
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="40"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="%23fff"/><circle cx="10" cy="10" r="6" fill="%23f8fafc" stroke="%23036f9a" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(%23g)"/></svg>`);
      }
      if (name === 'ribbon') {
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="40"><rect width="100%" height="100%" fill="%23fff"/><path d="M0 10 Q50 30 100 10 T200 10" stroke="%230369a1" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`);
      }
      return '';
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function handleBorderArtUpload(ev) {
      const f = ev?.target?.files && ev.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const data = e.target.result;
        const school = getActiveSchool(); if (!school) return;
        school.reportSettings = school.reportSettings || {};
        school.reportSettings.borderArtDataUrl = data;
        school.reportSettings.borderArt = 'custom';
        saveSchool(school);
        applyReportSettingsToUI();
      };
      reader.readAsDataURL(f);
    }

    function handleSignatureUpload(ev, settingKey) {
      const file = ev?.target?.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const school = getActiveSchool(); if (!school) return;
        school.reportSettings = school.reportSettings || {};
        school.reportSettings[settingKey] = e.target.result;

    function renderReportQRCodes() {
      const preview = document.getElementById('reportPreview');
      if (!preview || typeof QRCode !== 'function') return;
      preview.querySelectorAll('.report-qr').forEach(el => {
        const payload = el.getAttribute('data-qr');
        if (!payload) return;
        el.innerHTML = '';
        try {
          new QRCode(el, {
            text: decodeURIComponent(payload),
            width: 110,
            height: 110,
            colorDark: '#0f172a',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
          });
        } catch (err) {
          console.warn('QR code generation failed', err);
        }
      });
    }

                ${showDivision ? `<div style="text-align:center;background:#eff6ff;border:2px solid #0369a1;border-radius:5px;padding:5px 4px"><div style="font-size:7pt;color:#0369a1">DIVISION</div><div style="font-size:10pt;font-weight:800;color:#0369a1">${div}</div></div>` : ''}

              ${showGradingKey ? `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;padding:5px 8px">
                <div style="font-size:7pt;font-weight:700;color:#475569;margin-bottom:3px">GRADING KEY</div>
                <div style="display:flex;flex-wrap:wrap;gap:3px">${DB.gradeScale.map(g=>`<span style="font-size:7pt;padding:1px 5px;background:#e2e8f0;border-radius:10px"><strong>${g.grade}</strong> ${g.min}-${g.max}%</span>`).join('')}</div>

    function requestSchoolAdminReportAccess(className, term, action) {
      if (!canAccessAction(getCurrentSchoolRole(), action)) {
        showToast(`Your role does not have permission to ${action === 'print_report_cards' ? 'print' : 'generate'} report cards.`, 'error');
        return false;
      }
      const workflow = getMarkWorkflow(className, term);
      if (workflow.status !== 'class-compiled') {
        showToast('The Class Teacher must compile and upload this mark list before reports can be generated.', 'error');
        return false;
      }
      return true;
    }

    function printReportCards() {
      const className = document.getElementById('reportClass')?.value || '';
      const term = document.getElementById('reportTerm')?.value || '1';
      const servicePackage = document.getElementById('servicePackage')?.value || 'termly';
      const reportType = document.getElementById('reportType')?.value || 'ALL';
      const year = String(document.getElementById('reportYear')?.value || '2025');
      const school = getActiveSchool();
      if (!requestSchoolAdminReportAccess(className, term, 'print_report_cards')) return;
      if (!school || !hasPaidServiceFee(school, servicePackage)) {
        showToast('The System Owner must approve the service-fee payment before printing report cards.', 'error');
        return;
      }
      if (!generatedReportContext
        || generatedReportContext.className !== className
        || generatedReportContext.term !== term
        || generatedReportContext.servicePackage !== servicePackage
        || generatedReportContext.reportType !== reportType
        || generatedReportContext.year !== year) {
        showToast('Generate the current report cards before printing.', 'error');
        return;
      }
      window.print();
    }

    function assignTeacher(e, cls) {
      e.preventDefault();

      const tid = parseInt(e.target.teacherId.value);
      const selectedSubjects = [...e.target.querySelectorAll('input[name="subject"]:checked')].map(el => el.value);

      const t = DB.staff.find(s => s.id === tid);
      if (!t) {
        return showToast('Please select a valid teacher.', 'error');
      }
      DB.staff.forEach(s => {
        if (s.id === tid) {
          s.class = cls;
          s.subjects = selectedSubjects;
          s.subject = selectedSubjects[0] || '';

        }

    function addStudent(e) {
      e.preventDefault();
      if (!requireRolePermission('enroll_students')) return;
      const f = e.target;
      const gender = f.gender.value;
      const name = f.name.value.trim();
      const lin = f.lin.value.trim();
      const admNo = f.admNo.value.trim();
      const normalize = value => String(value || '').trim().toLowerCase();
      const duplicate = DB.students.find(student =>
        (lin && normalize(student.lin) === normalize(lin)) ||
        (admNo && normalize(student.admNo) === normalize(admNo)) ||
        (name && normalize(student.name) === normalize(name))
      );
      if (duplicate) {
        const duplicateClass = duplicate.class || 'another class';
        showToast(duplicate.class === f.class.value
          ? `Learner exists in ${duplicateClass}.`
          : `${name} already exists in this school in ${duplicateClass}.`, 'error');
        return;
      }
      let age = '';
      if (f.dob.value) age = new Date().getFullYear() - new Date(f.dob.value).getFullYear();
      DB.students.push({
        id: findNewId(DB.students), name, lin,
        admNo: f.admNo.value.trim() || ('ADM' + String(findNewId(DB.students) + 1000).padStart(4, '0')), class: f.class.value, gender, dob: f.dob.value,
        admDate: f.admDate.value, age, parent: f.parent.value.trim(),
        contact: f.contact.value.trim(), address: f.address.value.trim(),
        photo: gender === 'Female' ? '👧' : '👦'
      });
      saveAppData(); closeModal(); renderStudents();
      showToast(`${name} enrolled in ${f.class.value}!`, 'success');
    }

      const s = DB.students.find(x => x.id === sid);
      if (!s) return;
      const gender = f.gender.value;
      const normalize = value => String(value || '').trim().toLowerCase();
      const duplicate = DB.students.find(student => student.id !== sid &&
        student.class === f.class.value && (
          normalize(student.name) === normalize(f.name.value) ||
          (f.lin.value.trim() && normalize(student.lin) === normalize(f.lin.value)) ||
          (f.admNo.value.trim() && normalize(student.admNo) === normalize(f.admNo.value))
        )
      );
      if (duplicate) {
        showToast(`Learner exists in ${duplicate.class || f.class.value}.`, 'error');
        return;
      }
      s.name = f.name.value.trim(); s.lin = f.lin.value.trim(); s.admNo = f.admNo.value.trim();
      s.class = f.class.value; s.gender = gender;
      s.dob = f.dob.value; s.parent = f.parent.value.trim(); s.contact = f.contact.value.trim();
      s.address = f.address.value.trim(); s.photo = gender === 'Female' ? '👧' : '👦';
      if (f.dob.value) s.age = new Date().getFullYear() - new Date(f.dob.value).getFullYear();

                <textarea name="note" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="Optional reason or transfer note"></textarea></div>
              <div class="flex gap-3 pt-2">
                <button type="submit" class="px-4 py-2 bg-violet-600 hover:bg-violet-700 text-white rounded-lg font-medium">Transfer Class</button>
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg">Cancel</button>
              </div>
            </form>
        </div>`);
    }

    function transferStudent(e, sid) {
      e.preventDefault();
      if (!requireRolePermission('register_students')) return;
      const activeSchool = getActiveSchool();
      const studentIndex = DB.students.findIndex(student => student.id === sid);
      if (!activeSchool || studentIndex < 0) return;
      const destinationClass = e.target.elements.className.value;
      if (!destinationClass) {
        showToast('Select a destination class.', 'error');
        return;
      }
      const student = DB.students[studentIndex];
      if (student.class === destinationClass) {
        showToast('Choose a different class.', 'error');
        return;
      }
      if (!confirm(`Transfer ${student.name} from ${student.class || 'their current class'} to ${destinationClass}?`)) return;
      const previousClass = student.class || '';
      student.class = destinationClass;
      student.transferredFromClass = previousClass;
      student.transferDate = new Date().toISOString().slice(0, 10);
      student.transferNote = e.target.note.value.trim();
      saveAppData();
      closeModal();
      renderStudents();
      showToast(`${student.name} transferred to ${destinationClass}.`, 'success');
    }

    function deleteStudent(sid) {
      if (!requireRolePermission('register_students')) return;
      if (!confirm('Remove this student record?')) return;
      DB.students = DB.students.filter(s => s.id !== sid);
      saveAppData(); renderStudents(); showToast('Student removed.', 'success');
    }
  </script>
</body>
</html>
